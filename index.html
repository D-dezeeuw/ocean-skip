<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OceanSkips">
<meta name="theme-color" content="#0b2438">
<!-- GitHub Pages sits behind a CDN that can serve a stale deploy for a few
     minutes, and mobile "add to home screen" bookmarks cache even harder on
     top of that — these are a first line of defense; sw.js (registered
     below) is what actually forces a fresh fetch past both layers. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href='data:application/manifest+json,{"name":"OceanSkips","short_name":"OceanSkips","display":"fullscreen","orientation":"landscape","background_color":"%230b2438","theme_color":"%230b2438"}'>
<title>OceanSkips — Beach Fiesta 🐟🎉</title>
<link rel="icon" href="data:,">
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
    /* touch-action is not inherited: set it on every element so double-tap /
       pinch zoom is dead on the overlay buttons and cards too, while pan-x
       pan-y keeps the shop panel and fish-card row scrollable. */
    touch-action: pan-x pan-y;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', system-ui, sans-serif;
    background: #0b2438; color: #123;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; display: block; touch-action: none; }

  /* ---------- overlay screens ---------- */
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    padding: 12px calc(10px + env(safe-area-inset-right)) 12px calc(10px + env(safe-area-inset-left));
    text-align: center; z-index: 10;
  }
  .hidden { display: none !important; }
  h1.logo {
    font-size: clamp(30px, 7vw, 64px); color: #fff; letter-spacing: 2px; line-height: 1;
    text-shadow: 0 3px 0 #c2185b, 0 7px 16px #04293a99;
    transform: rotate(-2deg);
  }
  h1.logo .o2 { color: #ffd93b; }
  .tagline { color: #fff3d6; font-size: clamp(13px, 2.4vw, 18px); text-shadow: 0 2px 6px #04293a99; }

  .btn {
    font: inherit; font-size: 18px; font-weight: bold; color: #5a3a00;
    background: linear-gradient(#ffe27a, #ffc531);
    border: 3px solid #b97f00; border-radius: 16px;
    padding: 9px 24px; min-height: 44px; cursor: pointer;
    box-shadow: 0 4px 0 #b97f00, 0 8px 14px #0006;
    transition: transform .06s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b97f00; }
  .btn.pink { color: #fff; background: linear-gradient(#f95fa2, #d81b74); border-color: #96114f; box-shadow: 0 4px 0 #96114f, 0 8px 14px #0006; }
  .btn:disabled { filter: grayscale(.8) brightness(.85); cursor: default; }

  /* fish cards — one scrollable row, centers itself when it fits */
  .cards {
    display: flex; flex-wrap: nowrap; gap: 10px; max-width: 100%;
    overflow-x: auto; padding: 6px 4px; scrollbar-width: thin;
  }
  .cards::before, .cards::after { content: ''; margin: auto; }
  .card {
    flex: 0 0 auto; width: 150px; background: #fffdf5ee;
    border: 3px solid #d81b74; border-radius: 16px;
    padding: 8px 8px 10px; cursor: pointer; position: relative;
    box-shadow: 0 6px 14px #04293a66; transition: transform .08s;
  }
  .card:hover { transform: translateY(-3px) rotate(-1deg); }
  .card.sel { outline: 4px solid #ffd93b; box-shadow: 0 0 0 3px #b97f00, 0 8px 18px #04293a88; }
  .card canvas { width: 104px; height: 58px; }
  .card h3 { font-size: 16px; color: #b3125c; }
  .card .species { font-size: 11px; color: #467; margin-bottom: 4px; }
  .card .blurb { font-size: 10.5px; color: #245; min-height: 40px; margin-top: 5px; }
  .stat { display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: #245; }
  .stat b { width: 44px; text-align: right; font-weight: normal; }
  .bar { flex: 1; height: 7px; background: #ffe0ec; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff9800, #d81b74); border-radius: 4px; }

  .panel {
    background: #fffdf5ee; border: 3px solid #d81b74; border-radius: 20px;
    padding: 16px 20px; max-width: 540px; width: min(94vw, 540px);
    max-height: 92vh; overflow-y: auto;
    box-shadow: 0 10px 26px #04293a88;
  }
  .panel h2 { margin-bottom: 8px; color: #b3125c; }
  .uprow {
    display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 7px 0; border-bottom: 2px dashed #f3b8d1;
  }
  .uprow:last-of-type { border-bottom: 0; }
  .uprow .nm { flex: 1; }
  .uprow .nm b { font-size: 14px; }
  .uprow .nm small { display: block; font-size: 10.5px; color: #467; }
  .pips { display: flex; gap: 3px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: #ffe0ec; border: 1px solid #d98cb0; }
  .pip.on { background: #ffd93b; border-color: #b97f00; }
  .buy { font: inherit; font-size: 13px; font-weight: bold; padding: 6px 10px; min-height: 36px; border-radius: 10px;
    border: 2px solid #b97f00; background: linear-gradient(#ffe27a, #ffc531); color: #5a3a00; cursor: pointer; min-width: 72px; }
  .buy:disabled { filter: grayscale(.9) brightness(.9); cursor: default; }

  .foodbal { font-size: 16px; color: #5a3a00; background: #ffe27acc; border: 2px solid #b97f00;
    border-radius: 12px; padding: 3px 14px; display: inline-block; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px; z-index: 5; pointer-events: none;
  }
  .chip { background: #04293aa8; color: #fff; border-radius: 999px; padding: 4px 14px;
    font-size: 14px; text-shadow: 0 1px 2px #000a; white-space: nowrap; }
  .chip small { opacity: .75; font-size: 10px; }
  #hint {
    position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; z-index: 5; color: #fff3d6; font-size: clamp(13px, 2.4vw, 16px);
    text-shadow: 0 2px 6px #000c; pointer-events: none; padding: 0 60px;
  }
  #energy {
    position: fixed; left: calc(14px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 6px; z-index: 5; pointer-events: none;
  }
  #energy span { font-size: 22px; filter: drop-shadow(0 2px 3px #000a); }
  .ebar { width: min(240px, 34vw); height: 16px; background: #04293ab8; border-radius: 999px;
    border: 2px solid #ffffff55; overflow: hidden; }
  .ebar i { display: block; height: 100%; width: 50%;
    background: linear-gradient(90deg, #ff9800, #f44336); border-radius: 999px;
    transition: width .1s linear; }

  .cornerBtns { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
    display: flex; gap: 6px; z-index: 20; }
  .cornerBtns button { font-size: 16px; background: #04293aa8; color: #fff; border: 0;
    border-radius: 999px; width: 40px; height: 40px; cursor: pointer; }

  #results .big { font-size: clamp(28px, 6vw, 48px); color: #b3125c; }
  #results .newbest { color: #d9820b; font-weight: bold; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  .rowbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ---------- rotate-your-phone overlay ---------- */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(#d81b74, #7b1148);
    color: #fff; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; font-size: 20px; padding: 20px;
  }
  #rotate .ph { font-size: 64px; animation: spin90 1.6s ease-in-out infinite; }
  @keyframes spin90 { 0%, 20% { transform: rotate(0); } 55%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

  /* ---------- short landscape phones ---------- */
  @media (max-height: 480px) {
    .screen { gap: 7px; padding-top: 6px; padding-bottom: 6px; }
    h1.logo { font-size: 26px; }
    .tagline { font-size: 12px; }
    .btn { font-size: 15px; padding: 6px 16px; min-height: 40px; }
    .card { width: 128px; padding: 6px; }
    .card canvas { width: 88px; height: 48px; }
    .card .blurb { display: none; }
    .panel { padding: 8px 14px; }
    .uprow { padding: 4px 0; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <span class="chip" id="hudDist">0 m</span>
  <span class="chip" id="hudSpeed">0 <small>km/h</small></span>

  <button id="fsBtn" title="Fullscreen">⛶</button>

</div>

<!-- ---------- MENU ---------- -->
<div id="menu" class="screen">
  <h1 class="logo">Ocean<span class="o2">Skips</span></h1>
  <div class="tagline">Beach fiesta! Bat your fish clear across the ocean 🌊🎉</div>
  <div class="cards" id="fishCards"></div>
  <div class="rowbtns">
    <button class="btn" id="playBtn">Play! 🐟</button>

</div>

<!-- ---------- SHOP ---------- -->

</div>

<!-- ---------- RESULTS ---------- -->
<div id="results" class="screen hidden">
  <div class="panel">
    <h2 id="resTitle">Splashdown!</h2>
    <div class="big" id="resDist">0 m</div>
    <div id="resBestNote"></div>
    <p id="resLine" style="margin:6px 0 12px; font-size:13px; color:#245;"></p>
    <div class="rowbtns">
      <button class="btn" id="againBtn">Play again 🔁</button>
      <button class="btn pink" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

<div id="rotate"><div class="ph">📱</div>Rotate your phone!<br><small>OceanSkips is played in landscape 🌴</small></div>

<script>
'use strict';
(() => {

/* =====================================================================
   OceanSkips — single-file, offline, no-build fish-batting game.
   World coords: x → right (px), y → UP (px), calm water level at y = 0.
   Flow: menu → ready (tap = toss) → toss (tap = swing!) → fly
         (hold = chili boost) → sink → results.
   ===================================================================== */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- tuning ---------- */
const G = 1500;                 // gravity px/s²
const PX_PER_M = 40;            // world px per displayed metre
const LAUNCH_BASE = 1180;       // px/s at perfect contact, before fish/upgrades
const BAT_X = 150;              // where the luchador tosses/hits the fish
const TOSS_Y = 112;             // hand height above calm water
const TOSS_VY = 500;            // toss speed → apex ≈ TOSS_Y + 83 (fits short screens)
const SWEET_Y = TOSS_Y + 55;    // centre of the sweet-spot ring, on the way down
const SWEET_WIN = 80;           // contact quality window (px)
const OPEN_OCEAN = 22000;       // px where it's fully "deep dark ocean"
const ENERGY_FOOD = 25;         // energy per golden sphere
const BOOST_ACC = 660;          // px/s² while holding
const BOOST_DIVE = 260;         // px/s² added downward pull while holding — dive to aim your landing spot
const BOOST_DRAIN = 30;         // energy per second
const TRAIL_MAX = 22;           // motion-trail ribbon: max sampled points
const TRAIL_DT = 0.018;         // seconds between trail samples (~55/s, not every physics tick)
const SPEED_LINES_MIN = 1600;   // px/s above which speed-line streaks appear

/* ---------- the luchador ---------- */
const LUCHA = {
  skin: '#e8a06a', mask: '#d81b74', maskTrim: '#ffd93b', maskTrim2: '#43c6e0',
  serape: '#43c6e0', serapeStripe: '#f0567e', serapeStripe2: '#ffd93b',
  pants: '#3b3b57', boots: '#5a3a1e', hatCrown: '#e0a838', hatBrim: '#f0c565', hatBand: '#b3125c',
  bat: '#c98d4a', glove: '#f0567e',
};

/* ---------- the fish ---------- */
const FISH = [
  { id: 'chispa', name: 'Chispa', species: 'the Sardine', shape: 'slim',
    blurb: 'Queen of the bounce. Skips like she was born for it. (She was.)',
    power: 1.0, bounce: 0.58, drag: 0.10, lift: 0, minSkim: 250, seaLegs: 0.30, waveGrip: 1.0, size: 40, sail: 1.0,
    colors: { body: '#43c6e0', belly: '#eef9fc', fin: '#f0567e' } },
  { id: 'volador', name: 'Volador', species: 'the Flying Fish', shape: 'wing',
    blurb: 'Barely touches the water at all. Big waves ruin the hairdo.',
    power: 0.95, bounce: 0.50, drag: 0.045, lift: 0.55, minSkim: 240, seaLegs: 0.10, waveGrip: 1.2, size: 42, sail: 1.35,
    colors: { body: '#7f9bd8', belly: '#eef2ff', fin: '#ffd93b' } },
  { id: 'globo', name: 'Globo', species: 'the Pufferfish', shape: 'puff',
    blurb: 'Round. Bouncy. Extremely round. Boings off every wave.',
    power: 0.80, bounce: 0.80, drag: 0.16, lift: 0, minSkim: 200, seaLegs: 0.45, waveGrip: 0.9, size: 44, sail: 1.1,
    colors: { body: '#f2b04e', belly: '#ffedc9', fin: '#e0642f' } },
  { id: 'rayo', name: 'Rayo', species: 'the Mackerel', shape: 'dart',
    blurb: 'Launches like a rocket. Lands like a coin flip.',
    power: 1.25, bounce: 0.48, drag: 0.075, lift: 0, minSkim: 300, seaLegs: 0.25, waveGrip: 0.8, size: 44, sail: 0.75,
    colors: { body: '#59c9a5', belly: '#e2f8f0', fin: '#8e44ad' } },
  { id: 'donatun', name: 'Don Atún', species: 'the Tuna', shape: 'tank',
    blurb: 'Heavy. Slow to impress. The rough sea respects him.',
    power: 1.15, bounce: 0.50, drag: 0.12, lift: 0, minSkim: 280, seaLegs: 0.90, waveGrip: 0.5, size: 54, sail: 0.55,
    colors: { body: '#5b6ea8', belly: '#e2e8f6', fin: '#2c8c74' } },
  { id: 'velero', name: 'Velero', species: 'the Sailfish', shape: 'sail',
    blurb: 'Built entirely out of sail. Windy days, watch her fly. Calm days... less so.',
    power: 1.0, bounce: 0.42, drag: 0.09, lift: 0.2, minSkim: 320, seaLegs: 0.35, waveGrip: 0.85, size: 46, sail: 1.6,
    colors: { body: '#3d5a99', belly: '#dce6f5', fin: '#00c2d6' } },
];

/* ---------- upgrades ---------- */
const UPGRADES = [
  { id: 'power',  icon: '💪', name: 'Super Swing', desc: '+8% launch power per level' },
  { id: 'slick',  icon: '✨', name: 'Slick Scales', desc: '−9% air drag per level' },
  { id: 'rubber', icon: '🏀', name: 'Rubber Belly', desc: '+6% bounce per level' },
  { id: 'magnet', icon: '🧲', name: 'Snack Magnet', desc: 'Pulls in fish food from further away' },
  { id: 'chili',  icon: '🌶️', name: 'Chili Energy', desc: '+20 max boost energy per level' },
  { id: 'sail',   icon: '🪁', name: 'Kite Fins', desc: '+10% tailwind pull, softer headwind per level' },
];
const UP_MAX = 5;
const upCost = (lvl) => Math.round(20 * Math.pow(2.15, lvl) / 5) * 5;

/* ---------- save data ---------- */
const SAVE_KEY = 'oceanskips-save-v2';
let save = { food: 0, best: 0, runs: 0, fish: 'chispa', muted: false,
             up: { power: 0, slick: 0, rubber: 0, magnet: 0, chili: 0, sail: 0 } };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const s = JSON.parse(raw); save = { ...save, ...s, up: { ...save.up, ...(s.up || {}) } }; }
} catch (e) { /* file:// or private mode — play without persistence */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- audio: tiny synth, zero assets ---------- */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
// records every synth call's computed parameters (not gated on mute/audio
// availability) purely so headless tests can verify the intended
// velocity/angle relationships without needing to actually hear anything —
// see window.OceanSkips.audioLog.
let audioLog = [];
function logAudio(entry) { audioLog.push(entry); if (audioLog.length > 200) audioLog.shift(); }
function tone(freq, dur, { type = 'sine', vol = 0.2, slide = 0, delay = 0 } = {}) {
  logAudio({ fn: 'tone', freq, dur, type, vol, slide, delay });
  const ac = audio(); if (!ac || save.muted) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
// shared 1s noise buffer, reused (at a random start offset per call) for
// every filtered-noise burst so water sounds have real broadband texture
// instead of being pure oscillator tones — one buffer, never rebuilt.
let sharedNoiseBuf = null;
function noiseBurst(freq, dur, { vol = 0.2, q = 1.1, freqSlide = 0, filterType = 'bandpass', delay = 0 } = {}) {
  logAudio({ fn: 'noiseBurst', freq, dur, vol, q, freqSlide, filterType, delay });
  const ac = audio(); if (!ac || save.muted) return;
  if (!sharedNoiseBuf || sharedNoiseBuf.ac !== ac) {
    const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); // 1s of white noise
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    sharedNoiseBuf = { ac, buf };
  }
  const t0 = ac.currentTime + delay;
  const offset = Math.random() * (1 - dur - 0.02);
  const src = ac.createBufferSource();
  src.buffer = sharedNoiseBuf.buf;
  const filter = ac.createBiquadFilter();
  filter.type = filterType; filter.Q.value = q;
  filter.frequency.setValueAtTime(freq, t0);
  if (freqSlide) filter.frequency.exponentialRampToValueAtTime(Math.max(60, freq + freqSlide), t0 + dur);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(filter).connect(gain).connect(ac.destination);
  src.start(t0, offset, dur);
}
const sfx = {
  toss:    () => tone(300, 0.18, { type: 'triangle', vol: 0.16, slide: 260 }),
  crack: (q) => { tone(150, 0.1, { type: 'square', vol: 0.25, slide: -60 });
                  tone(500 + q * 500, 0.16, { type: 'triangle', vol: 0.2, slide: 300 }); },
  perfect: () => [660, 880, 1320].forEach((f, i) => tone(f, 0.12, { type: 'square', vol: 0.1, delay: i * 0.07 })),
  whiff:   () => tone(240, 0.3, { type: 'sawtooth', vol: 0.1, slide: -140 }),
  // steep (0 = grazing/horizontal, 1 = dead-on/vertical) picks the sound
  // between a light high "splish" and a round low "splosh"; sp (impact
  // speed) still adds brightness/volume on top of that, same as before.
  // A tonal ping gives the pitch identity; a filtered noise burst underneath
  // gives it real watery texture instead of a pure oscillator beep.
  skip: (sp, steep = 0.5) => {
    const spd = clamp(sp, 0, 2200), st = clamp(steep, 0, 1);
    const baseFreq = lerp(760, 220, st) + spd * 0.08;
    const dur = lerp(0.07, 0.2, st);
    const vol = lerp(0.15, 0.24, st) * clamp(0.5 + spd / 2200 * 0.6, 0.5, 1.1);
    tone(baseFreq, dur, { type: st > 0.5 ? 'sine' : 'triangle', vol, slide: -baseFreq * (0.5 + st * 0.3) });
    noiseBurst(lerp(2400, 700, st), dur * 0.9, { vol: vol * 0.75, q: 1.1 + st, freqSlide: -lerp(1200, 400, st) });
  },
  boost:   () => tone(120, 0.09, { type: 'sawtooth', vol: 0.06, slide: 60 }),
  collect: () => { tone(880, 0.09, { type: 'square', vol: 0.10 }); tone(1320, 0.14, { type: 'square', vol: 0.10, delay: 0.07 }); },
  // low-speed sink ending: a soft descending double-blip, like a bubble
  // glugging up, plus a short noise "glug" underneath for texture
  blub:    () => {
    tone(300, 0.22, { type: 'sine', vol: 0.2, slide: -170 });
    tone(210, 0.18, { type: 'sine', vol: 0.13, slide: -110, delay: 0.16 });
    noiseBurst(500, 0.12, { vol: 0.08, freqSlide: -260, delay: 0.02 });
  },
  // little mariachi-ish fanfare
  best:    () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, { type: 'square', vol: 0.11, delay: i * 0.09 })),
  click:   () => tone(600, 0.06, { type: 'square', vol: 0.08 }),
  buy:     () => { tone(700, 0.08, { type: 'square', vol: 0.1 }); tone(1050, 0.12, { type: 'square', vol: 0.1, delay: 0.06 }); },
  nope:    () => tone(160, 0.18, { type: 'square', vol: 0.1, slide: -60 }),
  gust:    () => tone(220, 0.35, { type: 'sawtooth', vol: 0.14, slide: 90 }),
};

/* ---------- wind whoosh: continuous filtered noise, gain AND pitch track
   air-relative speed x altitude — fast/high reads as a bright, loud rush;
   slow/low fades toward near-silent and dull rather than just quieter
   ---------- */
let windNoise = null;
function updateWindAudio(rsp, y) {
  if (save.muted || !actx) { if (windNoise) windNoise.gain.gain.value = 0; return; }
  if (!windNoise) {
    const bufSize = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const filter = actx.createBiquadFilter();
    filter.type = 'bandpass'; filter.Q.value = 0.6;
    const gain = actx.createGain();
    gain.gain.value = 0;
    src.connect(filter).connect(gain).connect(actx.destination);
    src.start();
    windNoise = { src, filter, gain };
  }
  const speedFrac = clamp(rsp / 1400, 0, 1);
  const altFactor = clamp(y / 350, 0.06, 1);   // low floor: near the water reads near-silent
  const g = Math.pow(speedFrac, 1.3) * altFactor * 0.13;
  const freq = lerp(110, 780, Math.pow(speedFrac, 0.85)); // low/muffled when slow, brighter when fast
  logAudio({ fn: 'wind', rsp, y, gain: g, freq });
  const t0 = actx.currentTime;
  windNoise.gain.gain.setTargetAtTime(g, t0, 0.1);
  windNoise.filter.frequency.setTargetAtTime(freq, t0, 0.15);
}
function silenceWindAudio() {
  if (windNoise && actx) windNoise.gain.gain.setTargetAtTime(0, actx.currentTime, 0.15);
}

/* ---------- canvas ---------- */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
let W = 0, H = 0, DPR = 1, VS = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // Size from the visual viewport (the browser's nav/tool bars shrink it on
  // phones) and pin the canvas CSS box to the same numbers — if the buffer
  // and the CSS box ever disagree, the browser stretches the buffer and the
  // whole game reads as "zoomed in" with the water pushed off-screen.
  const vv = window.visualViewport;
  const cssW = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
  const cssH = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
  cvs.style.width = cssW + 'px';
  cvs.style.height = cssH + 'px';
  cvs.width = Math.round(cssW * DPR);
  cvs.height = Math.round(cssH * DPR);
  // Short landscape viewports (browser chrome eating the height) get the
  // same scene zoomed out instead of cropped: below 480 CSS px the world is
  // drawn smaller and the logical canvas grows, so the toss arc, luchador
  // and water line always fit on screen together.
  VS = clamp(cssH / 480, 0.62, 1);
  W = cssW / VS; H = cssH / VS;
  ctx.setTransform(DPR * VS, 0, 0, DPR * VS, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => {
  // iOS reports stale viewport sizes right after rotating; snap back to
  // the top-left and re-measure once the new orientation has settled.
  window.scrollTo(0, 0);
  setTimeout(() => { window.scrollTo(0, 0); resize(); }, 250);
});
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

/* ---------- water: 10 hand-designed levels, 250m each, repeating in
   cycles with +10% amplitude every cycle. Replaces the old single
   continuous distance-based roughness ramp, which smoothly graded from
   calm to rough with no distinct stages — this makes each 250m stretch a
   readable, distinct "level" (sine → concave, slow → fast, sparse →
   layered), difficulty climbing within a cycle and again across cycles. */
const METERS_PER_LEVEL = 250;
const PX_PER_LEVEL = METERS_PER_LEVEL * PX_PER_M;      // 10,000 px
const LEVELS_PER_CYCLE = 10;
const PX_PER_CYCLE = PX_PER_LEVEL * LEVELS_PER_CYCLE;  // 100,000 px
const CYCLE_GROWTH = 0.10;       // +10% wave amplitude every full cycle
const LEVEL_BLEND_PX = 1400;     // ~35m crossfade so levels don't pop underfoot

// Each level is a short recipe of components: a = amplitude in px (before
// cycle scaling), l = wavelength (px), s = speed (px/s, sign = travel
// direction), q = concave-crest sharpness (omitted = plain sine, matching
// the old wave shape). `rough` is a hand-tuned difficulty scalar consumed
// by the skim-speed penalty and the wind-strength ramp — kept independent
// of amplitude since wavelength and concavity shift the felt difficulty too.
const WAVE_LEVELS = [
  { name: 'Easy swell',      rough: 0.65, comps: [
    { a: 6,  l: 420, s: 26 } ] },
  { name: 'Big swell',       rough: 0.95, comps: [
    { a: 15, l: 380, s: 34 } ] },
  { name: 'Gentle chop',     rough: 1.05, comps: [
    { a: 9,  l: 260, s: 42, q: 0.6 } ] },
  { name: 'Sharp chop',      rough: 1.35, comps: [
    { a: 18, l: 230, s: 48, q: 0.5 } ] },
  { name: 'Chop over swell', rough: 1.55, comps: [
    { a: 11, l: 520, s: 22 },
    { a: 13, l: 220, s: 50, q: 0.55 } ] },
  { name: 'Fast ripple',     rough: 1.70, comps: [
    { a: 9,  l: 150, s: 66 },
    { a: 12, l: 900, s: 24, q: 0.5 } ] },  // long q wavelength = concave spikes only occasionally
  { name: 'Ripple + chop',   rough: 1.90, comps: [
    { a: 10, l: 150, s: 70 },
    { a: 14, l: 420, s: 34, q: 0.5 } ] },
  { name: 'Rough mix',       rough: 2.15, comps: [
    { a: 12, l: 130, s: 78 },
    { a: 17, l: 260, s: 52, q: 0.45 } ] },
  { name: 'Heavy chaos',     rough: 2.45, comps: [
    { a: 10, l: 110, s: 86 },
    { a: 16, l: 210, s: 60, q: 0.45 },
    { a: 9,  l: 480, s: 30 } ] },
  { name: 'Maelstrom',       rough: 2.80, comps: [
    { a: 12, l: 95,  s: 95 },
    { a: 20, l: 190, s: 66, q: 0.4 },
    { a: 11, l: 430, s: 32 } ] },
];
const REF_MAX_ROUGH = WAVE_LEVELS[WAVE_LEVELS.length - 1].rough;

// never let more than this many full wave periods fit across the current
// viewport (W, world px) — some levels' hand-tuned wavelengths are short
// enough that a wide screen would otherwise show a dozen+ tiny ripples at
// once, which reads as noise rather than a readable wave pattern.
const MIN_WAVES_PER_SCREEN = 5;
function effectiveWavelen(l) {
  const minL = W > 0 ? W / MIN_WAVES_PER_SCREEN : 0;
  return Math.max(l, minL);
}

// unit-amplitude wave with a sharp concave crest: y = 1 − 2·|sin(θ/2)|^q
function peakProfile(th, q) {
  const s = Math.sin(th / 2);
  const u = Math.abs(s);
  const ue = Math.max(u, 0.02);            // keep the cusp's slope finite
  return { y: 1 - 2 * Math.pow(u, q),
           d: -q * Math.pow(ue, q - 1) * Math.sign(s) * Math.cos(th / 2) };
}
// each concave component's DC offset depends only on q, so it's memoized
// once per distinct q rather than recomputed every call
const peakOffsetCache = new Map();
function peakOffset(q) {
  let off = peakOffsetCache.get(q);
  if (off === undefined) {
    let m = 0;
    for (let i = 0; i < 64; i++) m += peakProfile((i / 64) * TAU, q).y;
    off = m / 64;
    peakOffsetCache.set(q, off);
  }
  return off;
}

// slowly-varying, smoothly-interpolated value noise (grid hash + smoothstep
// interpolation, so it's C1-continuous — no pops) used to break up the wave
// field's perfect periodicity. Its strength scales with a level's effective
// difficulty (irregAmtFor), so calm early levels stay clean/uniform while
// later, harder levels read as genuinely rough and unpredictable instead of
// a perfectly repeating sum of a few fixed sines.
function valueNoise1D(x, seed) {
  const i = Math.floor(x), f = x - i;
  const a = hash01(i + seed), b = hash01(i + 1 + seed);
  const t = f * f * (3 - 2 * f);
  return { v: lerp(a, b, t), d: (b - a) * (6 * f - 6 * f * f) };
}
const WAVE_IRREGULARITY = 0.5; // max +/-50% height swing at the hardest effective rough
function roughnessMod(x, seed, amt) {
  if (amt <= 0) return { m: 1, dm: 0 };
  const n1 = valueNoise1D(x / 820, seed);
  const n2 = valueNoise1D(x / 260, seed + 51.3);
  const v = (n1.v - 0.5) * 0.7 + (n2.v - 0.5) * 0.3;
  const dv = n1.d * (0.7 / 820) + n2.d * (0.3 / 260);
  return { m: 1 + amt * v * 2, dm: amt * dv * 2 };
}
function irregAmtFor(effRough) {
  return clamp((effRough - 1) / (REF_MAX_ROUGH - 1), 0, 1) * WAVE_IRREGULARITY;
}

let levelPhaseSeed = 0; // rolled per run so repeats don't feel identical
function rollWaves() { levelPhaseSeed = rand(0, 1000); }
rollWaves();
// deterministic per-(level,component) phase, stable for the whole run via
// levelPhaseSeed, so a level's components don't resync every attempt
function levelCompPhase(levelIdx, compIdx) {
  return hash01(levelIdx * 17.3 + compIdx * 5.7 + levelPhaseSeed) * TAU;
}

/* ---------- intro ramp: the very first 1000m (= levels 0-3's combined
   span) is one continuous, slowly-evolving swell instead of 4 discrete
   250m blocks — starts as a long, barely-curved sine ("two screens" of
   wavelength) and only gradually shortens/steepens/gains a concave crest
   as it approaches level 3's "Sharp chop" character, which it then
   settles into and blends with over the last stretch before handing off
   to the ordinary discrete level system at level 4. Only ever runs once,
   at the true start of a run — x only increases, so a repeat cycle's
   "level 0" territory (well past x=INTRO_PX) always uses the normal
   discrete blocks, giving a quicker breather on repeat cycles. */
const INTRO_PX = 1000 * PX_PER_M;               // 40,000 px = levels 0-3's span
const INTRO_START = { a: 5,  l: 1900, s: 16 };  // near-flat, two-screens-long swell
const INTRO_TARGET = WAVE_LEVELS[3].comps[0];   // hand off into 'Sharp chop'
const INTRO_START_ROUGH = 0.5;                  // calmer than level 0's 0.65
const INTRO_TARGET_ROUGH = WAVE_LEVELS[3].rough;
const INTRO_CONCAVE_START = 0.4; // concave crest only fades in after the ramp is 40% done
function introParamsAt(x) {
  const w = smoothstep(0, INTRO_PX, x);
  return {
    w,
    a: lerp(INTRO_START.a, INTRO_TARGET.a, w),
    l: lerp(INTRO_START.l, INTRO_TARGET.l, w),
    s: lerp(INTRO_START.s, INTRO_TARGET.s, w),
    rough: lerp(INTRO_START_ROUGH, INTRO_TARGET_ROUGH, w),
    concaveMix: clamp((w - INTRO_CONCAVE_START) / (1 - INTRO_CONCAVE_START), 0, 1),
  };
}
function introRamp(x, t) {
  const p = introParamsAt(x);
  const k = TAU / effectiveWavelen(p.l);
  const ph = k * x + p.s * k * t + levelCompPhase(-1, 0);
  const sy = p.a * Math.sin(ph), sslope = p.a * k * Math.cos(ph), svy = p.a * (p.s * k) * Math.cos(ph);
  let y = sy, slope = sslope, vy = svy;
  if (p.concaveMix > 0) {
    const q = INTRO_TARGET.q;
    const pk = peakProfile(ph, q);
    const cy = p.a * (pk.y - peakOffset(q)), cslope = p.a * pk.d * k, cvy = p.a * pk.d * (p.s * k);
    y = lerp(sy, cy, p.concaveMix);
    slope = lerp(sslope, cslope, p.concaveMix);
    vy = lerp(svy, cvy, p.concaveMix);
  }
  const { m, dm } = roughnessMod(x, -1 * 13.7 + levelPhaseSeed * 0.021, irregAmtFor(p.rough));
  return { y: y * m, slope: slope * m + y * dm, vy: vy * m, rough: p.rough };
}

function levelInfoAt(x) {
  const px = Math.max(0, x);
  const cycle = Math.floor(px / PX_PER_CYCLE);
  const withinCycle = px - cycle * PX_PER_CYCLE;
  const levelIdx = Math.min(LEVELS_PER_CYCLE - 1, Math.floor(withinCycle / PX_PER_LEVEL));
  const posInLevel = withinCycle - levelIdx * PX_PER_LEVEL;
  return { cycle, levelIdx, posInLevel, mult: 1 + CYCLE_GROWTH * cycle };
}
// blend weight + adjacent level info near a level/cycle boundary, shared by
// roughAt (just needs the scalar) and surfaceAt (needs the full wave sum)
function levelBlendAt(x) {
  const info = levelInfoAt(x);
  const distToBoundary = PX_PER_LEVEL - info.posInLevel;
  let w = 0, nextIdx = info.levelIdx, nextMult = info.mult;
  if (distToBoundary < LEVEL_BLEND_PX) {
    const t2 = 1 - distToBoundary / LEVEL_BLEND_PX;
    w = t2 * t2 * (3 - 2 * t2); // smoothstep
    nextIdx = info.levelIdx + 1;
    let nextCycle = info.cycle;
    if (nextIdx >= LEVELS_PER_CYCLE) { nextIdx = 0; nextCycle += 1; }
    nextMult = 1 + CYCLE_GROWTH * nextCycle;
  }
  return { levelIdx: info.levelIdx, mult: info.mult, nextIdx, nextMult, w };
}
function roughAt(x) {
  if (x < INTRO_PX) {
    const introRough = introParamsAt(x).rough;
    if (x < INTRO_PX - LEVEL_BLEND_PX) return introRough;
    const w2 = smoothstep(INTRO_PX - LEVEL_BLEND_PX, INTRO_PX, x);
    return lerp(introRough, WAVE_LEVELS[4].rough, w2);
  }
  const b = levelBlendAt(x);
  const cur = WAVE_LEVELS[b.levelIdx].rough * b.mult;
  if (b.w <= 0) return cur;
  return lerp(cur, WAVE_LEVELS[b.nextIdx].rough * b.nextMult, b.w);
}
function evalLevel(levelIdx, mult, x, t) {
  const level = WAVE_LEVELS[levelIdx];
  let y = 0, slope = 0, vy = 0;
  for (let i = 0; i < level.comps.length; i++) {
    const c = level.comps[i];
    const k = TAU / effectiveWavelen(c.l);
    const ph = k * x + c.s * k * t + levelCompPhase(levelIdx, i);
    const A = c.a * mult;
    if (c.q) {
      const pk = peakProfile(ph, c.q);
      y += A * (pk.y - peakOffset(c.q));
      slope += A * pk.d * k;
      vy += A * pk.d * (c.s * k);
    } else {
      y += A * Math.sin(ph);
      slope += A * k * Math.cos(ph);
      vy += A * (c.s * k) * Math.cos(ph);
    }
  }
  const { m, dm } = roughnessMod(x, levelIdx * 13.7 + levelPhaseSeed * 0.021, irregAmtFor(level.rough * mult));
  return { y: y * m, slope: slope * m + y * dm, vy: vy * m };
}
function surfaceAt(x, t) {
  if (x < INTRO_PX) {
    const intro = introRamp(x, t);
    if (x < INTRO_PX - LEVEL_BLEND_PX) return intro;
    const w2 = smoothstep(INTRO_PX - LEVEL_BLEND_PX, INTRO_PX, x);
    const nxt = evalLevel(4, 1, x, t);
    return {
      y: lerp(intro.y, nxt.y, w2), slope: lerp(intro.slope, nxt.slope, w2),
      vy: lerp(intro.vy, nxt.vy, w2), rough: lerp(intro.rough, WAVE_LEVELS[4].rough, w2),
    };
  }
  const b = levelBlendAt(x);
  const cur = evalLevel(b.levelIdx, b.mult, x, t);
  const curRough = WAVE_LEVELS[b.levelIdx].rough * b.mult;
  if (b.w <= 0) return { ...cur, rough: curRough };
  const nxt = evalLevel(b.nextIdx, b.nextMult, x, t);
  const nxtRough = WAVE_LEVELS[b.nextIdx].rough * b.nextMult;
  return {
    y: lerp(cur.y, nxt.y, b.w), slope: lerp(cur.slope, nxt.slope, b.w),
    vy: lerp(cur.vy, nxt.vy, b.w), rough: lerp(curRough, nxtRough, b.w),
  };
}

/* ---------- wind: boundary-layer shear, sheltered near the waves,
   full-strength aloft — high arcs catch it, low skims don't ---------- */
const WIND_WAVE_AMP = 22;   // px — rough per-zone wave-amplitude estimate
const WIND_RAMP = 220;      // px of altitude to go from sheltered to full wind
let wind = { base: 0, dir: 1, gustAmp: 0 };
let windGustComps = [];
let gustBoostT = 0; // seconds remaining on a triggered gust-front event's wind spike
// {base, dir} are seeded from the calendar day (not Math.random()), so
// every attempt today sees the same core wind and a best-distance chase
// stays fair; gustAmp/gust component phases still vary per attempt for
// texture, since those are a secondary effect.
function dailySeed() {
  const d = new Date();
  const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return h;
}
function rollWind() {
  const seed = dailySeed();
  const h1 = hash01(seed), h2 = hash01(seed * 1.37 + 91.3);
  wind.dir = h2 < 0.8 ? 1 : -1;     // mostly tailwind, occasional headwind day
  wind.base = lerp(20, 230, h1);    // some days are genuinely calm, deterministic per day
  wind.gustAmp = rand(0.15, 0.35);
  windGustComps = [
    { w: 0.5, s: rand(0.5, 1.0), k: TAU / 900, p: rand(0, TAU) },
    { w: 0.3, s: rand(-0.8, -0.4), k: TAU / 380, p: rand(0, TAU) },
    { w: 0.2, s: rand(0.2, 0.4), k: TAU / 2200, p: rand(0, TAU) },
  ];
}
rollWind(); // populate today's wind immediately so the menu can show it
function smoothstep(e0, e1, y) {
  const t = clamp((y - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
function shelterTopAt(x) { return roughAt(x) * WIND_WAVE_AMP; }
function gustAt(x, t) {
  let s = 0;
  for (const c of windGustComps) s += c.w * Math.sin(t * c.s + x * c.k + c.p);
  return 1 + wind.gustAmp * s;
}
function windAt(x, y, t) {
  const top = shelterTopAt(x);
  const shelter = smoothstep(top, top + WIND_RAMP, y);
  // it blows a little harder as the waves get rougher, same signal roughAt uses
  const distBoost = lerp(1, 1.3, clamp((roughAt(x) - 1) / (REF_MAX_ROUGH - 1), 0, 1));
  // a triggered gust front spikes wind strength for a few seconds
  const gustFrontBoost = 1 + clamp(gustBoostT / 2.5, 0, 1) * 0.6;
  return wind.base * distBoost * gustFrontBoost * wind.dir * shelter * gustAt(x, t);
}

/* ---------- gust fronts & thermals: telegraphed flight events, spawned
   ahead of the fish the same way food is ---------- */
let gustEvents = [], nextGustX = 1500;
function spawnGustsAhead() {
  const horizon = cam.x + W * 2.2;
  while (nextGustX < horizon) {
    gustEvents.push({ x: nextGustX, triggered: false });
    nextGustX += rand(2600, 5200);
  }
  if (gustEvents.length > 60) gustEvents = gustEvents.filter(g => g.x > cam.x - 600);
}
let thermals = [], nextThermalX = 2200;
function spawnThermalsAhead() {
  const horizon = cam.x + W * 2.2;
  while (nextThermalX < horizon) {
    thermals.push({ x: nextThermalX, width: rand(180, 320), strength: rand(500, 900) });
    nextThermalX += rand(3200, 6000);
  }
  if (thermals.length > 40) thermals = thermals.filter(th => th.x > cam.x - 600);
}
// gentle updraft inside a thermal column, strongest around mid-altitude and
// at the column's centre — a bell curve in both x and y
function thermalLiftAt(x, y) {
  let lift = 0;
  const MID_ALT = 260, ALT_SPREAD = 140;
  for (const th of thermals) {
    const dx = Math.abs(x - th.x);
    if (dx > th.width) continue;
    const horiz = 1 - dx / th.width;
    const vert = Math.exp(-((y - MID_ALT) ** 2) / (2 * ALT_SPREAD * ALT_SPREAD));
    lift += th.strength * horiz * vert;
  }
  return lift;
}

/* ---------- environment palettes by distance ---------- */
const ZONES = [
  { x: 0,     skyT: '#8fd8ff', skyB: '#ffe9c9', seaT: '#37c8da', seaD: '#0b6e8a', light: 1.0 },
  { x: 9000,  skyT: '#6db4e8', skyB: '#e8d9c4', seaT: '#2596b9', seaD: '#0a4a6e', light: 0.85 },
  { x: 16000, skyT: '#4a7aae', skyB: '#9db8d0', seaT: '#1b6a92', seaD: '#082f4e', light: 0.62 },
  { x: OPEN_OCEAN, skyT: '#2b3a55', skyB: '#5a6b85', seaT: '#12405f', seaD: '#04101e', light: 0.4 },
  { x: 34000, skyT: '#151d2e', skyB: '#3a4358', seaT: '#0a2438', seaD: '#020810', light: 0.28 },
];
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}
function paletteAt(x) {
  let i = 0;
  while (i < ZONES.length - 2 && x > ZONES[i + 1].x) i++;
  const a = ZONES[i], b = ZONES[i + 1];
  const t = clamp((x - a.x) / (b.x - a.x), 0, 1);
  return { skyT: mixHex(a.skyT, b.skyT, t), skyB: mixHex(a.skyB, b.skyB, t),
           seaT: mixHex(a.seaT, b.seaT, t), seaD: mixHex(a.seaD, b.seaD, t),
           light: lerp(a.light, b.light, t) };
}
const PICADO = ['#f0567e', '#ff9800', '#43c6e0', '#9ccc2e', '#ffd93b', '#a05fc4'];

/* ===== END GENERATED ASSETS ===== */
// Each entry decodes lazily into an Image; every user is expected to check
// `.loaded` and fall back to the existing procedural drawing when an asset
// is missing or hasn't decoded yet (data: URIs decode near-instantly, but
// technically still async via Image.onload).
const assets = {};
for (const id in GENERATED_ASSETS) {
  const el = new Image();
  const rec = { el, loaded: false };
  el.onload = () => { rec.loaded = true; };
  el.src = GENERATED_ASSETS[id];
  assets[id] = rec;
}
// buildMenu() runs at boot before these decode, so its fish-card thumbnails
// start out procedural; once everything's loaded, rebuild once so the
// generated portraits take over if we're still sitting on the menu screen.
Promise.all(Object.values(assets).map((a) => new Promise((res) => {
  if (a.loaded) return res();
  a.el.addEventListener('load', res, { once: true });
  a.el.addEventListener('error', res, { once: true });
}))).then(() => { if (state === 'menu') buildMenu(); });

/* ---------- game state ---------- */
let state = 'menu';   // menu | ready | toss | fly | sink | done | shop
let time = 0;
let cam = { x: 0, y: 0 };
let camShake = { amp: 0, t: 0 };  // decaying screen shake, applied inside w2sx/w2sy
let hitstopT = 0;                 // seconds of physics-frozen "impact frame" remaining
let fishDef = FISH.find(f => f.id === save.fish) || FISH[0];
let held = false;     // pointer/space currently down (boost)

const run = {
  x: 0, y: 0, vx: 0, vy: 0, wiggle: 0,
  skips: 0, food: 0, dist: 0, sinkT: 0, spinning: 0,
  tossVy: 0, swingT: -1,          // swingT ≥ 0 → bat swing anim clock
  energy: 0, maxEnergy: 100,
  lastBounceT: 0, boostSfxT: 0, zoneShown: 0,
  hopApex: 0,   // highest y reached since the last bounce — Big Air scoring
  squashT: -1,  // time of the last impact (swing contact / bounce) — drives squash&stretch
  trail: [],    // {x,y} ribbon of recent positions while flying — motion trail
};
const BIG_AIR_Y = 260; // world y a hop's apex must clear to score Big Air
let bigAirCount = 0; // debug/test counter, not shown in-game

let foods = [];        // {x, baseY, taken, phase}
let nextFoodX = 0;
let particles = [];    // {x,y,vx,vy,life,maxLife,size,color,grav,kind?}
let popups = [];       // {str,x,y,t,life,size,color} — floating canvas text
let foamPatches = [];  // {x, born, size} — persistent surface foam left by skips
let clouds = [];
function initClouds() {
  clouds = [];
  for (let i = 0; i < 12; i++) clouds.push({ x: rand(0, 4000), y: rand(140, 420), scale: rand(0.6, 1.6), speed: rand(4, 12) });
}
initClouds();

// wind-streak particles: fast horizontal streaks up high, calm near the
// waves — the shear profile made visible so players learn "fly high for
// wind" without reading anything. Purely screen-space (yFrac 0 = near the
// water line, 1 = near the top of the sky) so streaks always sit in the
// visible sky band regardless of where the camera has panned — anchoring
// them to a fixed world-y altitude instead would scroll them out of view
// during exactly the high arcs they're meant to highlight.
let windStreaks = [];
function initWindStreaks() {
  windStreaks = [];
  for (let i = 0; i < 16; i++) windStreaks.push({ frac: rand(-1, 1), yFrac: rand(0, 1), len: rand(18, 46) });
}
initWindStreaks();
function stepWindStreaks(dt) {
  const mag = Math.abs(wind.base);
  if (mag < 10) return;
  for (const s of windStreaks) {
    const speedPxPerSec = wind.dir * mag * (0.12 + s.yFrac * 1.1);
    s.frac += (speedPxPerSec * dt) / (W || 900);
    if (s.frac > 1.15 || s.frac < -1.15) {
      s.frac = s.frac > 0 ? -1.15 : 1.15;
      s.yFrac = rand(0, 1); s.len = rand(18, 46);
    }
  }
}

/* ---------- derived stats (fish + upgrades) ---------- */
function stats() {
  const u = save.up;
  return {
    launch: LAUNCH_BASE * fishDef.power * (1 + u.power * 0.08),
    drag: fishDef.drag * (1 - u.slick * 0.09),
    bounce: Math.min(0.92, fishDef.bounce * (1 + u.rubber * 0.06)),
    magnetR: 46 + fishDef.size * 0.4 + u.magnet * 22,
    maxEnergy: 100 + u.chili * 20,
    lift: fishDef.lift,
    minSkim: fishDef.minSkim,
    seaLegs: fishDef.seaLegs,
    waveGrip: fishDef.waveGrip,
    sail: fishDef.sail * (1 + (u.sail || 0) * 0.1),
  };
}

/* ---------- food spawning ---------- */
function spawnFoodAhead() {
  const horizon = cam.x + W * 2.2;
  while (nextFoodX < horizon) {
    const n = 3 + Math.floor(rand(0, 3));
    const cx = nextFoodX, arc = Math.random() < 0.5;
    const baseH = rand(46, 250), spread = rand(46, 70);
    for (let i = 0; i < n; i++) {
      const h = arc ? baseH + Math.sin((i / (n - 1)) * Math.PI) * rand(40, 110) : baseH;
      foods.push({ x: cx + i * spread, baseY: h, taken: false, phase: rand(0, TAU) });
    }
    nextFoodX = cx + n * spread + rand(420, 950);
  }
  if (foods.length > 400) foods = foods.filter(f => f.x > cam.x - 600 && !f.taken);
}

/* ---------- particles & popups ---------- */
function puff(x, y, n, color, spd, grav = 900, size = 4, life = 0.6) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.abs(Math.sin(a)) * s,
      life, maxLife: life * rand(0.6, 1), size: rand(size * 0.5, size * 1.4), color, grav });
  }
}
function splash(x, y, power) {
  const n = clamp(Math.round(power / 55), 6, 30);
  puff(x, y, n, '#ffffff', clamp(power * 0.45, 120, 620), 1500, 5, 0.7);
  puff(x, y, Math.round(n / 2), '#bfeaf5', clamp(power * 0.3, 90, 420), 1200, 7, 0.55);
}
function sparkle(x, y, color = '#ffd93b') {
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU), s = rand(60, 240);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5, maxLife: 0.5, size: rand(2, 5), color, grav: 0 });
  }
}
// static expanding stroked ring — bat-contact impact feedback. Piggybacks on
// the regular particle system (vx=0/vy=0/grav=0 so the default step logic
// just ages it) with a 'ring' kind that drawParticles renders specially.
function hitRing(x, y, { color = '#ffffff', size = 40, life = 0.3 } = {}) {
  particles.push({ x, y, vx: 0, vy: 0, life, maxLife: life, size, color, grav: 0, kind: 'ring' });
}
// wobbling underwater bubble — rises, drifts, and pops into a tiny surface
// fleck when it reaches surfaceAt(x,t) instead of just fading out in place
function spawnBubble(x, y, { life = 1.2, minSize = 2, maxSize = 5 } = {}) {
  particles.push({
    x, y, vx: rand(-6, 6), vy: rand(28, 62), life, maxLife: life,
    size: rand(minSize, maxSize), color: '#eaf9ff', grav: -34, kind: 'bubble',
    wobPhase: rand(0, TAU), wobFreq: rand(1.6, 3.2), wobAmp: rand(3, 9),
  });
}
function popup(str, x, y, { size = 22, color = '#fff', life = 1.2 } = {}) {
  popups.push({ str, x, y, t: 0, life, size, color });
}
function stepParticles(dt) {
  const pops = [];
  for (const p of particles) {
    p.life -= dt;
    if (p.kind === 'bubble') {
      p.wobPhase += dt * p.wobFreq;
      p.x += (p.vx + Math.sin(p.wobPhase) * p.wobAmp) * dt;
      p.y += p.vy * dt;
      p.vy -= p.grav * dt;
      const s = surfaceAt(p.x, time);
      if (p.y >= s.y) {
        p.life = 0;
        for (let i = 0; i < 3; i++) pops.push({
          x: p.x + rand(-4, 4), y: s.y, vx: rand(-16, 16), vy: rand(10, 40),
          life: 0.3, maxLife: 0.3, size: rand(1.5, 3), color: '#ffffff', grav: 40 });
      }
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= p.grav * dt;
    }
  }
  particles = particles.filter(p => p.life > 0).concat(pops);
  capParticles();
  for (const p of popups) { p.t += dt; p.y += 42 * dt; }
  popups = popups.filter(p => p.t < p.life);
  foamPatches = foamPatches.filter(f => time - f.born < 2);
}
// global particle budget: ambient bubbles are the lowest priority and go
// first, then whichever gameplay particle (splash/spark) has the least
// life left — keeps a busy skip chain from ballooning the draw count
const PARTICLE_CAP = 220;
function capParticles() {
  const over = particles.length - PARTICLE_CAP;
  if (over <= 0) return;
  particles.sort((a, b) => {
    const pa = a.kind === 'bubble' ? 0 : 1, pb = b.kind === 'bubble' ? 0 : 1;
    return pa !== pb ? pa - pb : a.life - b.life;
  });
  particles.splice(0, over);
}

// respects the OS/browser "reduce motion" setting: skips the busiest purely
// decorative motion (wind streaks, gust shimmer, thermal wobble) while
// keeping gameplay-critical feedback (the gust popup/sfx, the gust's actual
// wind effect) untouched
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// auto quality scaler: if the smoothed frame time creeps past 20ms (< 50fps
// equivalent), drop the heaviest optional layers one at a time — second
// caustics layer, then god rays, then new ambient bubble spawns — restoring
// them in reverse once headroom returns. Never touches gameplay-critical
// rendering (fish, water contact, HUD).
let smoothFrameMs = 16.7;
const quality = { causticsLayer2: true, rays: true, ambientBubbles: true };
function updateQualityScaler(frameMs) {
  smoothFrameMs = lerp(smoothFrameMs, clamp(frameMs, 0, 100), 0.1);
  if (smoothFrameMs > 20) {
    if (quality.causticsLayer2) quality.causticsLayer2 = false;
    else if (quality.rays) quality.rays = false;
    else if (quality.ambientBubbles) quality.ambientBubbles = false;
  } else if (smoothFrameMs < 14) {
    if (!quality.ambientBubbles) quality.ambientBubbles = true;
    else if (!quality.rays) quality.rays = true;
    else if (!quality.causticsLayer2) quality.causticsLayer2 = true;
  }
}
// stable per-slot ambient bubble seep columns rising from the seabed/kelp —
// spawn is gated by a per-slot timer so density stays steady regardless of
// frame rate, and slot choice reuses hash01 so the same world positions seep
// every time rather than rerolling which columns exist each frame
let bubbleColTimer = 0;
function stepBubbleColumns(dt) {
  if (!quality.ambientBubbles) return;
  bubbleColTimer -= dt;
  if (bubbleColTimer > 0) return;
  bubbleColTimer = rand(0.3, 0.55);
  const SPACING = 240;
  const first = Math.floor(cam.x / SPACING) - 1;
  const count = Math.ceil(W / SPACING) + 2;
  for (let i = 0; i < count; i++) {
    const slot = first + i;
    if (hash01(slot * 13.7) > 0.4) continue; // only some slots are seep columns
    const worldX = slot * SPACING + (hash01(slot * 3.3) - 0.5) * 40;
    const s = surfaceAt(worldX, time);
    spawnBubble(worldX, s.y - rand(50, 170), { life: 1.6, minSize: 1.5, maxSize: 3.5 });
  }
}

/* ---------- run lifecycle ---------- */
function startRun() {
  const st = stats();
  state = 'ready';
  rollWaves();
  rollWind();
  run.x = BAT_X + 40; run.y = TOSS_Y; run.vx = 0; run.vy = 0;
  run.skips = 0; run.food = 0; run.dist = 0; run.sinkT = 0; run.spinning = 0;
  run.tossVy = 0; run.swingT = -1; run.lastBounceT = -1; run.zoneShown = 0; run.hopApex = TOSS_Y;
  run.squashT = -1; run.trail = [];
  run.maxEnergy = st.maxEnergy;
  run.energy = Math.min(run.maxEnergy, 55 + save.up.chili * 8);
  cam.x = 0; cam.y = 0;
  held = false;
  foods = []; nextFoodX = 800; particles = []; popups = [];
  gustEvents = []; nextGustX = 1500; thermals = []; nextThermalX = 2200; gustBoostT = 0;
  showScreen(null);
  hud(true);
  let windHint = '';
  if (Math.abs(wind.base) >= 140) {
    windHint = wind.dir > 0 ? ' 💨 Strong tailwind — fly HIGH!' : ' 💨 Headwind today — stay low!';
  } else if (Math.abs(wind.base) >= 25) {
    windHint = wind.dir > 0 ? ' 💨 Light tailwind.' : ' 💨 Light headwind.';
  }

}
function toss() {
  state = 'toss';
  run.vy = TOSS_VY;
  sfx.toss();
  setHint('Tap to SWING when the fish drops through the ring! 🎯');
}
function swing() {
  const st = stats();
  run.swingT = 0;
  const q = clamp(1 - Math.abs(run.y - SWEET_Y) / SWEET_WIN, 0, 1);
  if (q <= 0.02) { flop('Swing and a miss! 💨'); sfx.whiff(); return; }
  // contact height → angle: hit high (early) = steep, hit low (late) = flat;
  // sweet spot gives a skip-friendly 30°
  const angleDeg = clamp(30 + (run.y - SWEET_Y) * 0.38, 12, 62);
  const a = angleDeg * Math.PI / 180;
  let p = st.launch * (0.5 + 0.55 * q);
  const perfect = q > 0.92;
  if (perfect) {
    p *= 1.08;
    popup('¡PERFECTO! 🔥', run.x, run.y + 60, { size: 30, color: '#ffd93b' });
    sparkle(run.x, run.y, '#ffd93b'); sparkle(run.x, run.y, '#f0567e');
    sfx.perfect();
  }
  run.vx = Math.cos(a) * p;
  run.vy = Math.sin(a) * p;
  state = 'fly';
  held = false;                       // require a fresh press for boosting
  run.hopApex = run.y;
  run.squashT = time;
  sfx.crack(q);
  puff(run.x, run.y, 12, '#ffe9b0', 300, 800, 4, 0.4);
  hitRing(run.x, run.y, { color: perfect ? '#ffd93b' : '#ffffff', size: perfect ? 58 : 38, life: 0.32 });
  if (!REDUCED_MOTION) {
    hitstopT = 0.05 * (0.6 + q);

}
function flop(msg) {

  run.vx = 330; run.vy = 210;   // enough to clear the beach and plop in the sea

}
function beginSink() {

}
function endRun() {
  state = 'done';

  const m = Math.round(run.dist / PX_PER_M);
  const isBest = m > save.best;
  if (isBest) save.best = m;

  document.getElementById('resLine').textContent =
    `${run.skips} skip${run.skips === 1 ? '' : 's'} · 🟡 ${run.food} fish food` +

function pickTitle(m, best) {

  if (m < 150) return 'Not bad!';
