/* ---------- physics ---------- */
const FIXED = 1 / 240;
let acc = 0;
function stepPhysics(dt) {
  const st = stats();

  if (state === 'toss') {
    run.vy -= G * dt;
    run.y += run.vy * dt;
    if (run.y < TOSS_Y - 26 && run.vy < 0) { flop('Oops — dropped it! 😅'); sfx.whiff(); run.swingT = -1; }
  }

  if (state === 'fly') {
    // chili boost while held: speeds you up along your current heading AND
    // pulls you down into a dive — the longer you hold, the sooner/steeper
    // you come down, so you can choose where on the wave you land instead
    // of always riding out the same arc
    if (held && run.energy > 0) {
      const sp = Math.hypot(run.vx, run.vy) || 1;
      run.vx += (run.vx / sp) * BOOST_ACC * dt;
      run.vy += (run.vy / sp) * BOOST_ACC * dt - BOOST_DIVE * dt;
      run.energy = Math.max(0, run.energy - BOOST_DRAIN * dt);
      if (time - run.boostSfxT > 0.1) { sfx.boost(); run.boostSfxT = time; }
      // the flame itself is drawn (drawBoostFlame); just a few loose embers
      // kicking off it for extra spice
      if (Math.random() < dt * 12) particles.push({
        x: run.x - rand(10, 26), y: run.y + rand(-8, 8),
        vx: -run.vx * 0.15, vy: rand(-30, 30),
        life: 0.35, maxLife: 0.35, size: rand(2, 5), color: '#ff9800', grav: 0 });
    }

    // air drag + gravity (+ glide lift for the flying fish) — computed
    // against AIR-RELATIVE velocity, so a tailwind actually pushes the fish
    // toward wind speed instead of only ever slowing it down. Wind is near
    // zero close to the waves (shelterTopAt) and ramps to full strength over
    // WIND_RAMP px of altitude, so low skims fly on raw launch power while
    // high arcs catch the wind. Kite Fins (save.up.sail) softens headwind
    // days specifically — up to 25% less headwind bite at max level — on
    // top of the tailwind boost already folded into st.sail.
    if (gustBoostT > 0) gustBoostT = Math.max(0, gustBoostT - dt);
    const headwindSoften = wind.dir < 0 ? (1 - (save.up.sail || 0) * 0.05) : 1;
    const wx = windAt(run.x, run.y, time) * st.sail * headwindSoften;
    const rvx = run.vx - wx, rvy = run.vy;
    const rsp = Math.hypot(rvx, rvy);
    const dragF = st.drag * rsp * 0.0016 * dt;
    run.vx -= rvx * dragF;
    run.vy -= rvy * dragF;
    let g = G;
    if (st.lift > 0 && run.vy < 0) g *= 1 - st.lift * clamp(rvx / 1100, 0, 1) * 0.62;
    run.vy -= g * dt;
    run.vy += thermalLiftAt(run.x, run.y) * dt;
    run.x += run.vx * dt;
    run.y += run.vy * dt;
    run.dist = Math.max(run.dist, run.x - BAT_X);
    run.hopApex = Math.max(run.hopApex, run.y);
    run.wiggle += dt * (6 + Math.hypot(run.vx, run.vy) * 0.004);
    updateWindAudio(rsp, run.y);

    // motion trail: sample position at a fixed cadence (not every physics
    // step — that'd bunch 22 points into a fraction of a second) so the
    // ribbon spans a readable stretch of recent flight
    const lastTrail = run.trail[run.trail.length - 1];
    if (!lastTrail || time - lastTrail.t >= TRAIL_DT) {
      run.trail.push({ x: run.x, y: run.y, t: time, sp: Math.hypot(run.vx, run.vy) });
      if (run.trail.length > TRAIL_MAX) run.trail.shift();
    }

    // gust fronts: crossing an untriggered wall gives a temporary wind spike
    for (const gEvt of gustEvents) {
      if (!gEvt.triggered && run.x > gEvt.x) {
        gEvt.triggered = true;
        gustBoostT = 2.5;
        popup('💨 Gust front!', run.x, run.y + 80, { size: 20, color: '#dff6ff' });
        sfx.gust();
      }
    }

    // zone announcements
    if (run.zoneShown === 0 && run.x > 9000)  { run.zoneShown = 1; popup('~ Open Water ~', run.x, run.y + 90, { size: 26, color: '#dff6ff' }); }
    if (run.zoneShown === 1 && run.x > OPEN_OCEAN) { run.zoneShown = 2; popup('~ THE OPEN OCEAN! ~', run.x, run.y + 90, { size: 28, color: '#ffd93b' }); }

    // food pickups (with magnet pull)
    for (const f of foods) {
      if (f.taken || Math.abs(f.x - run.x) > 620) continue;
      const s0 = surfaceAt(f.x, time);
      const fy = s0.y + f.baseY + Math.sin(time * 2 + f.phase) * 6;
      const dx = f.x - run.x, dy = fy - run.y;
      const d = Math.hypot(dx, dy);
      if (d < st.magnetR * 3 && d > 1) {
        f.baseY -= (dy / d) * 340 * dt * clamp(1 - d / (st.magnetR * 3), 0, 1);
        f.x -= (dx / d) * 340 * dt * clamp(1 - d / (st.magnetR * 3), 0, 1);
      }
      if (d < st.magnetR) {
        f.taken = true;
        run.food++; save.food++;
        run.energy = Math.min(run.maxEnergy, run.energy + ENERGY_FOOD);
        const spd = Math.hypot(run.vx, run.vy) || 1;
        run.vx += (run.vx / spd) * 90;      // small free kick
        run.vy += (run.vy / spd) * 90 + 40;
        sparkle(f.x, fy);
        popup('+⚡', f.x, fy + 16, { size: 16, color: '#ffd93b', life: 0.7 });
        sfx.collect();
      }
    }

    // water contact
    const s = surfaceAt(run.x, time);
    if (run.y <= s.y) {
      // surface normal tilted by the wave slope; grip < 1 = fish cuts through chop
      // (slope clamped so a landing right on a cusp can't produce a wild normal)
      let nx = -clamp(s.slope, -1.6, 1.6) * st.waveGrip, ny = 1;
      const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
      const vn = run.vx * nx + run.vy * ny;
      if (vn < 0) {
        const speed = Math.hypot(run.vx, run.vy);
        const steep = -vn / (speed || 1);            // 1 = dead-on plunge
        let e = st.bounce;
        if (steep > 0.8) e *= clamp(1.55 - steep, 0.3, 1); // belly-flop penalty
        // decompose, reflect, add kick from the moving wave surface
        const tx = run.vx - vn * nx, ty = run.vy - vn * ny;
        run.vx = tx * 0.955 - vn * e * nx;
        run.vy = ty * 0.955 - vn * e * ny + Math.max(0, s.vy) * 0.6 * st.waveGrip;
        run.y = s.y + 0.5;

        // Big Air: reward the hop that just ended if its apex cleared
        // BIG_AIR_Y, rewarding the risky high arcs wind makes attractive —
        // then start tracking the next hop fresh
        if (run.hopApex > BIG_AIR_Y) {
          const bonus = clamp(Math.round((run.hopApex - BIG_AIR_Y) / 45), 1, 6);
          run.food += bonus; save.food += bonus;
          bigAirCount++;
          popup(`Big Air! +${bonus}🟡`, run.x, run.hopApex, { size: 22, color: '#ffd93b' });
          sfx.collect();
        }
        run.hopApex = run.y;

        const newSp = Math.hypot(run.vx, run.vy);
        const roughPenalty = 1 + (s.rough - 1) * 0.38 * (1 - st.seaLegs);
        const need = st.minSkim * roughPenalty;
        if (newSp < need || run.vx < 30) {
          splash(run.x, s.y, speed * (0.4 + steep));
          beginSink();
        } else {
          run.vy = Math.max(run.vy, 55 + (newSp - need) * 0.05); // keep shallow grazes lively
          if (time - run.lastBounceT > 0.09) {
            run.lastBounceT = time;
            run.skips++;
            splash(run.x, s.y, speed * (0.4 + steep));
            for (let k = 0; k < 4; k++) spawnBubble(run.x + rand(-10, 10), s.y - rand(4, 20), { life: 0.6, minSize: 1.5, maxSize: 3 });
            foamPatches.push({ x: run.x, born: time, size: rand(16, 26) });
            sfx.skip(newSp, steep);
            if (run.skips === 10) popup('¡Órale! 🎉', run.x, run.y + 70, { size: 24, color: '#ffd93b' });
          }
        }
      } else {
        run.y = s.y + 0.5; // riding up the back of a wave
      }
    }
  }

  if (state === 'sink') {
    run.sinkT += dt;
    run.vx *= (1 - 2.2 * dt);
    run.vy = lerp(run.vy, -60, 3 * dt);
    run.x += run.vx * dt;
    run.y += run.vy * dt;
    run.spinning += dt * 3;
    if (Math.random() < dt * 14) spawnBubble(run.x + rand(-8, 8), run.y + rand(0, 10), { life: 1.1, minSize: 2, maxSize: 5 });
    if (run.sinkT > 1.5) endRun();
  }

  if (run.swingT >= 0) run.swingT += dt;
}

/* ---------- camera ---------- */
function stepCamera(dt) {
  let tx = cam.x, ty = cam.y;
  if (state === 'fly' || state === 'sink') {
    tx = Math.max(0, run.x - W * 0.34);
    ty = Math.max(0, run.y - H * 0.45);
  } else if (state === 'ready' || state === 'toss') {
    tx = 0; ty = 0;
  } else { // menu drift
    cam.x += 24 * dt;
    if (cam.x > menuWrapLimit) cam.x = 0;
    return;
  }
  const k = 1 - Math.pow(0.0018, dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);
  if (camShake.amp > 0) {
    camShake.t += dt;
    camShake.amp = Math.max(0, camShake.amp - dt * 42); // quick decay, ~0.15-0.3s
  }
}
let menuWrapLimit = 4200;
const seaLine = () => H * 0.66;
// a decaying screen shake (set by big bat contacts) offsets every drawn
// layer identically since it's baked into the shared world->screen mapping
function shakeX() { return camShake.amp > 0 ? (hash01(Math.floor(camShake.t * 60) * 3.7) - 0.5) * 2 * camShake.amp : 0; }
function shakeY() { return camShake.amp > 0 ? (hash01(Math.floor(camShake.t * 60) * 9.1 + 5) - 0.5) * 2 * camShake.amp : 0; }
const w2sx = (x) => x - cam.x + shakeX();
const w2sy = (y) => seaLine() - (y - cam.y) + shakeY();

/* ---------- drawing ---------- */
function drawSky(pal) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal.skyT); g.addColorStop(1, pal.skyB);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const sunX = W * 0.78 - cam.x * 0.02, sunY = H * 0.2 + cam.x * 0.004;
  ctx.globalAlpha = clamp(pal.light, 0.15, 1);
  ctx.fillStyle = pal.light > 0.55 ? '#ffd93b' : '#e8ecf5';
  ctx.beginPath(); ctx.arc(sunX, sunY, 44, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.25 * pal.light;
  ctx.beginPath(); ctx.arc(sunX, sunY, 74, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  // cloud drift keyed to the day's wind — same direction and roughly
  // proportional speed, so windy days visibly hustle the sky along
  const cloudWindMul = 1 + wind.dir * clamp(wind.base / 260, 0, 0.85);
  ctx.fillStyle = pal.light > 0.5 ? '#ffffff' : '#7c8aa3';
  for (const c of clouds) {
    const px = ((c.x - cam.x * 0.25 - time * c.speed * cloudWindMul) % (W + 500) + W + 500) % (W + 500) - 250;
    const py = H * 0.06 + (c.y * 0.5) - cam.y * 0.15;
    ctx.globalAlpha = 0.85;
    cloudBlob(px, py, c.scale);
  }
  ctx.globalAlpha = 1;

  if (cam.x > OPEN_OCEAN + 4000 && Math.random() < 0.006) {
    ctx.fillStyle = '#cfd8ff'; ctx.globalAlpha = 0.18;
    ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }

  if (!REDUCED_MOTION) drawWindStreaks(pal);
}
function cloudBlob(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 22 * s, 0, TAU);
  ctx.arc(x + 24 * s, y - 8 * s, 17 * s, 0, TAU);
  ctx.arc(x + 46 * s, y, 20 * s, 0, TAU);
  ctx.arc(x + 22 * s, y + 8 * s, 16 * s, 0, TAU);
  ctx.fill();
}
function drawWindStreaks(pal) {
  const mag = Math.abs(wind.base);
  if (mag < 10) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  const dir = wind.dir || 1;
  const skyBottom = clamp(seaLine() * 0.8, 40, H - 20); // stay in the sky, above the water
  for (const s of windStreaks) {
    const shelterAmt = smoothstep(0.12, 0.55, s.yFrac);
    if (shelterAmt < 0.06) continue;
    const sx = ((s.frac + 1) / 2) * W;
    const sy = lerp(skyBottom, 20, s.yFrac); // yFrac 0 near the water, 1 near the top
    ctx.globalAlpha = clamp(pal.light, 0, 1) * shelterAmt * 0.6;
    ctx.beginPath();
    ctx.moveTo(sx - s.len * dir, sy);
    ctx.lineTo(sx, sy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineCap = 'butt';
}

function drawPicado() {
  // papel picado bunting — fiesta HQ decoration, fades as you fly out to sea;
  // semi-transparent during play so it never hides the ball game
  const inMenu = state === 'menu' || state === 'shop' || state === 'done';
  const alpha = (inMenu ? 1 : 0.55) * clamp(1 - cam.x / 2600, 0, 1);
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha;
  for (let row = 0; row < 2; row++) {
    const y0 = 26 + row * 34, sag = 26 + row * 8;
    const n = Math.ceil(W / 46) + 1;
    ctx.strokeStyle = '#5d3a15'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, y0);
    ctx.quadraticCurveTo(W / 2, y0 + sag * 2, W + 10, y0);
    ctx.stroke();
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const fx = -10 + t * (W + 20);
      const flapRate = 1.6 + Math.abs(wind.base) * 0.012;
      const fy = y0 + sag * 2 * t * (1 - t) * 2 + Math.sin(time * flapRate + i + row * 3) * 2.5;
      ctx.fillStyle = PICADO[(i + row * 3) % PICADO.length];
      ctx.beginPath();
      ctx.moveTo(fx - 15, fy);
      ctx.lineTo(fx + 15, fy);
      ctx.lineTo(fx + 15, fy + 18);
      ctx.lineTo(fx + 9, fy + 24);
      ctx.lineTo(fx + 3, fy + 18);
      ctx.lineTo(fx - 3, fy + 24);
      ctx.lineTo(fx - 9, fy + 18);
      ctx.lineTo(fx - 15, fy + 24);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff66';
      ctx.beginPath(); ctx.arc(fx, fy + 10, 3, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawBeach() {
  if (cam.x > 1100) return;
  // sand — ends just past the luchador so flops still reach open water
  ctx.fillStyle = '#f6d789';
  ctx.beginPath();
  ctx.moveTo(w2sx(-80), H);
  ctx.lineTo(w2sx(-80), w2sy(68));
  ctx.quadraticCurveTo(w2sx(100), w2sy(56), w2sx(240), w2sy(-14));
  ctx.lineTo(w2sx(240), H);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#e0b95e'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(w2sx(-80), w2sy(64));
  ctx.quadraticCurveTo(w2sx(100), w2sy(52), w2sx(236), w2sy(-16));
  ctx.stroke();

  // palm tree
  const px = w2sx(16), py = w2sy(64);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.quadraticCurveTo(px - 14, py - 90, px - 40, py - 150);
  ctx.stroke();
  ctx.strokeStyle = '#2e9c4f'; ctx.lineWidth = 8;
  for (let i = 0; i < 5; i++) {
    const a = -0.5 - i * 0.5;
    ctx.beginPath();
    ctx.moveTo(px - 40, py - 150);
    ctx.quadraticCurveTo(px - 40 + Math.cos(a) * 46, py - 150 + Math.sin(a) * 46,
                         px - 40 + Math.cos(a) * 84, py - 150 + Math.sin(a) * 60);
    ctx.stroke();
  }
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.arc(px - 34, py - 144, 6, 0, TAU); ctx.arc(px - 46, py - 140, 6, 0, TAU); ctx.fill();

  // beach umbrella, tucked behind the luchador — flutters with the day's wind
  const ux = w2sx(64), uy = w2sy(52);
  const flutter = clamp(wind.dir * wind.base * 0.0006, -0.12, 0.12) + Math.sin(time * 1.3) * 0.02;
  ctx.save();
  ctx.translate(ux, uy); ctx.rotate(flutter); ctx.translate(-ux, -uy);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(ux + 6, uy - 62); ctx.stroke();
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i % 2 ? '#f0567e' : '#ffd93b';
    ctx.beginPath();
    ctx.moveTo(ux + 6, uy - 62);
    const a1 = Math.PI + (i / 5) * Math.PI, a2 = Math.PI + ((i + 1) / 5) * Math.PI;
    ctx.arc(ux + 6, uy - 56, 44, a1, a2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.lineCap = 'butt';
}

// swing timeline breakpoints (seconds since run.swingT was zeroed at contact)
const SWING_COIL_END = 0.06, SWING_STRIKE_END = 0.14, SWING_SETTLE_END = 0.45;

// derives every swing-driven pose value from run.swingT/state in one place,
// so the arm-swing angle, the bat's own whip rotation, the crouch depth and
// the torso lean all stay in sync instead of drifting apart
function luchadorPose() {
  let armA = -1.75, batA = 0.6, crouch = 0.15, lean = 0, sway = 0;
  if (state === 'ready' || state === 'toss') {
    crouch = 0.35 + Math.sin(time * 3) * 0.03;
    lean = Math.sin(time * 1.6) * 0.03;
    sway = Math.sin(time * 1.6) * 3;
    armA = -1.9 + Math.sin(time * 6) * 0.04;
    batA = -2.9 + Math.sin(time * 6) * 0.04;
  }
  if (run.swingT >= 0) {
    const t = run.swingT;
    if (t < SWING_COIL_END) {                              // deepen the coil
      const tt = t / SWING_COIL_END;
      armA = lerp(-1.9, -2.2, tt); batA = lerp(-2.9, -3.15, tt);
      crouch = lerp(0.35, 0.5, tt); lean = lerp(0.03, -0.14, tt);
    } else if (t < SWING_STRIKE_END) {                      // the strike
      const tt = (t - SWING_COIL_END) / (SWING_STRIKE_END - SWING_COIL_END);
      armA = lerp(-2.2, -0.25, tt); batA = lerp(-3.15, 0.6, tt);
      crouch = lerp(0.5, 0.05, tt); lean = lerp(-0.14, 0.28, tt);
    } else if (t < SWING_SETTLE_END) {                      // elastic follow-through
      const tt = (t - SWING_STRIKE_END) / (SWING_SETTLE_END - SWING_STRIKE_END);
      const battEased = tt < 0.35 ? lerp(0.6, 1.1, tt / 0.35) : lerp(1.1, 0.6, (tt - 0.35) / 0.65);
      armA = lerp(-0.25, -0.55, clamp(tt, 0, 1)); batA = battEased;
      crouch = lerp(0.05, 0.15, clamp(tt, 0, 1)); lean = lerp(0.28, 0.05, clamp(tt, 0, 1));
    } else {
      armA = -0.55; batA = 0.6; crouch = 0.15; lean = 0.05;
    }
  }
  return { armA, batA, crouch, lean, sway };
}

// tapered two-point limb (shoulder/hip -> hand/foot) with a perpendicular
// bend offset for a bent-elbow/bent-knee silhouette, drawn as one filled path
function drawLimb(x0, y0, x1, y1, bend, w0, w1, color) {
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const kx = mx + nx * bend, ky = my + ny * bend;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x0 - (ny * w0), y0 + (nx * w0));
  ctx.quadraticCurveTo(kx - ny * (w0 + w1) / 2, ky + nx * (w0 + w1) / 2, x1 - ny * w1, y1 + nx * w1);
  ctx.lineTo(x1 + ny * w1, y1 - nx * w1);
  ctx.quadraticCurveTo(kx + ny * (w0 + w1) / 2, ky - nx * (w0 + w1) / 2, x0 + ny * w0, y0 - nx * w0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function drawLuchador() {
  if (cam.x > 1100) return;
  const pose = luchadorPose();
  const x = w2sx(BAT_X - 34) + pose.sway, y = w2sy(44); // feet on the sand
  ctx.save();
  ctx.translate(x, y);
  ctx.lineWidth = 2.5; ctx.strokeStyle = FISH_INK;

  // ---- legs: bent-knee batter stance, deepening into the coil ----
  const hipY = -26 + pose.crouch * 9, stanceOut = 11 + pose.crouch * 3;
  drawLimb(-stanceOut, hipY, -stanceOut - 3, 0, -5 - pose.crouch * 5, 6.5, 5, LUCHA.pants);
  drawLimb(stanceOut, hipY, stanceOut + 3, 0, 5 + pose.crouch * 5, 6.5, 5, LUCHA.pants);
  ctx.fillStyle = LUCHA.boots;
  ctx.beginPath(); ctx.ellipse(-stanceOut - 4, 1, 8, 4, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(stanceOut + 4, 1, 8, 4, 0, 0, TAU); ctx.fill(); ctx.stroke();

  // ---- torso: rounded serape, hem drawn as a wavy line so it flutters
  // with a bit of self-motion plus the day's actual wind ----
  const breathe = (state === 'ready' || state === 'toss') ? 1 + Math.sin(time * 1.8) * 0.012 : 1;
  ctx.save();
  ctx.rotate(pose.lean * 0.4);
  ctx.scale(1, breathe);
  ctx.fillStyle = LUCHA.serape;
  ctx.beginPath();
  ctx.moveTo(0, -72);
  ctx.quadraticCurveTo(-6, -48, -25, hipY + 6);
  ctx.quadraticCurveTo(0, hipY + 15, 25, hipY + 6);
  ctx.quadraticCurveTo(6, -48, 0, -72);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  const gust = windAt(BAT_X, 80, time) * 0.0006;
  ctx.strokeStyle = LUCHA.serapeStripe; ctx.lineWidth = 3.5;
  ctx.beginPath();
  for (let i = -2; i <= 2; i++) {
    const hx2 = i * 10, hy2 = hipY + 4 + Math.sin(time * 2.4 + i) * 1.5 + gust * (i * 6);
    if (i === -2) ctx.moveTo(hx2, hy2); else ctx.lineTo(hx2, hy2);
  }
  ctx.stroke();
  ctx.strokeStyle = LUCHA.serapeStripe2; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-18, -38); ctx.lineTo(18, -38); ctx.stroke();
  ctx.restore();

  // ---- back arm + bat: swings from the shoulder (pose.armA), the bat
  // itself whips within the grip (pose.batA) for a secondary snap ----
  const shoulderB = { x: 7, y: -55 };
  const grip = { x: shoulderB.x + Math.cos(pose.armA) * 27, y: shoulderB.y + Math.sin(pose.armA) * 27 };
  const elbowBendB = run.swingT >= 0 && run.swingT < SWING_STRIKE_END ? 10 : 5;
  drawLimb(shoulderB.x, shoulderB.y, grip.x, grip.y, elbowBendB, 5.5, 4, LUCHA.skin);

  // front (off-hand) arm reaching to the same grip point for a two-handed hold
  const shoulderF = { x: -7, y: -50 };
  drawLimb(shoulderF.x, shoulderF.y, grip.x, grip.y, -8, 5, 4, LUCHA.skin);

  // motion smear: a few fading ghost bats sampled a beat earlier, only
  // during the strike window when the bat is moving fastest
  if (run.swingT >= SWING_COIL_END && run.swingT < SWING_STRIKE_END + 0.03) {
    for (let i = 1; i <= 2; i++) {
      const ghostT = Math.max(0, run.swingT - i * 0.028);
      if (ghostT < SWING_COIL_END) continue;
      const gtt = (ghostT - SWING_COIL_END) / (SWING_STRIKE_END - SWING_COIL_END);
      const ga = lerp(-3.15, 0.6, clamp(gtt, 0, 1));
      ctx.save();
      ctx.globalAlpha = 0.16 / i;
      ctx.translate(grip.x, grip.y);
      ctx.rotate(ga);
      ctx.fillStyle = LUCHA.bat;
      ctx.beginPath(); ctx.roundRect(-4, -58, 8, 60, 4); ctx.fill();
      ctx.restore();
    }
  }

  // bat + hands
  ctx.save();
  ctx.translate(grip.x, grip.y);
  ctx.rotate(pose.batA);
  ctx.fillStyle = LUCHA.bat; ctx.strokeStyle = FISH_INK; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(-4, -58, 8, 60, 4); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-4, -6 + i * 5); ctx.lineTo(4, -6 + i * 5); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = LUCHA.glove; ctx.strokeStyle = FISH_INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(grip.x, grip.y, 5.5, 0, TAU); ctx.fill(); ctx.stroke();

  // ---- head with luchador mask; pupils track the fish while it's up ----
  ctx.lineWidth = 2.5;
  ctx.fillStyle = LUCHA.mask;
  ctx.beginPath(); ctx.arc(0, -84, 16, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = LUCHA.maskTrim2; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, -84, 12.5, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-16, -84); ctx.lineTo(-20, -80);
  ctx.moveTo(16, -84); ctx.lineTo(20, -80);
  ctx.stroke();
  ctx.strokeStyle = FISH_INK; ctx.lineWidth = 2.5;
  let pupilOff = { x: 0, y: -1 };
  if (state === 'ready' || state === 'toss') {
    const wdx = run.x - (BAT_X - 34), wdy = run.y - 44;
    const ang = Math.atan2(-wdy, wdx);
    pupilOff = { x: Math.cos(ang), y: Math.sin(ang) };
  }
  ctx.fillStyle = LUCHA.maskTrim;
  ctx.beginPath(); ctx.ellipse(-6, -86, 4.5, 6, 0, 0, TAU); ctx.ellipse(6, -86, 4.5, 6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = FISH_INK;
  ctx.beginPath();
  ctx.arc(-6 + pupilOff.x * 1.6, -86 + pupilOff.y * 2, 2, 0, TAU);
  ctx.arc(6 + pupilOff.x * 1.6, -86 + pupilOff.y * 2, 2, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#7a1f3d'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-6, -74); ctx.quadraticCurveTo(0, -71, 6, -74);
  ctx.stroke();

  // ---- sombrero with a curved brim and two swaying tassels ----
  ctx.strokeStyle = FISH_INK; ctx.lineWidth = 2.5;
  ctx.fillStyle = LUCHA.hatBrim;
  ctx.beginPath(); ctx.ellipse(0, -96, 30, 8, -0.08, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = LUCHA.hatCrown;
  ctx.beginPath(); ctx.ellipse(0, -103, 13, 9, -0.08, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = LUCHA.hatBand; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, -100, 12.5, 3.2, -0.08, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = LUCHA.hatBand; ctx.lineWidth = 2;
  for (const side of [-1, 1]) {
    const tx0 = side * 27, ty0 = -93;
    const sway2 = Math.sin(time * 2.2 + side * 1.7) * 3;
    ctx.beginPath();
    ctx.moveTo(tx0, ty0);
    ctx.quadraticCurveTo(tx0 + side * 2 + sway2 * 0.5, ty0 + 8, tx0 + side * 1 + sway2, ty0 + 15);
    ctx.stroke();
    ctx.fillStyle = LUCHA.hatBand;
    ctx.beginPath(); ctx.arc(tx0 + side * 1 + sway2, ty0 + 15, 1.8, 0, TAU); ctx.fill();
  }

  ctx.restore();
}

// per-shape body half-height as a fraction of f.size — each of the six
// silhouettes gets its own proportions instead of sharing one ellipse
const FISH_HH = { slim: 0.44, wing: 0.48, puff: 0.86, dart: 0.42, tank: 0.62, sail: 0.46 };
const FISH_INK = '#1e2a3a';
const SIL_FILL = '#1c2b40', SIL_INK = '#111c2c'; // locked-card silhouette colors

// 5-stop body shading: dark back → rim highlight → flank → hard belly line
function fishBodyGrad(c, f, Hh) {
  const g = c.createLinearGradient(0, -Hh, 0, Hh);
  g.addColorStop(0, mixHex(f.colors.body, FISH_INK, 0.38));
  g.addColorStop(0.16, mixHex(f.colors.body, '#ffffff', 0.3));
  g.addColorStop(0.34, f.colors.body);
  g.addColorStop(0.62, f.colors.body);
  g.addColorStop(0.66, f.colors.belly);
  g.addColorStop(1, f.colors.belly);
  return g;
}

function drawFishShape(c, f, t, opts = {}) {
  // draws centred at (0,0) facing +x — caller sets the transform on ctx `c`
  const L = f.size, Hh = f.size * (FISH_HH[f.shape] || 0.5);
  const sil = !!opts.silhouette;
  // tail whips harder at speed and lags a beat behind the body-mounted fins
  const wigAmp = 0.1 + clamp((opts.speed || 0) / 2400, 0, 1) * 0.1;
  const wig = Math.sin(t * 9) * wigAmp;
  const wigTail = Math.sin(t * 9 - 0.7) * wigAmp * 1.5;
  const seed = (f.id.charCodeAt(0) + f.id.length * 7) * 3.1;
  const ink = sil ? SIL_INK : FISH_INK;
  const finCol = sil ? SIL_FILL : f.colors.fin;
  c.lineWidth = 2.5;
  c.strokeStyle = ink;

  // ---- tail (behind the body) ----
  c.fillStyle = finCol;
  c.beginPath();
  if (f.shape === 'slim' || f.shape === 'wing') {          // forked two-lobe
    c.moveTo(-L * 0.36, 0);
    c.quadraticCurveTo(-L * 0.5, -Hh * 0.16, -L * 0.76, -Hh * (0.72 - wigTail));
    c.quadraticCurveTo(-L * 0.6, -Hh * 0.12, -L * 0.54, 0);
    c.quadraticCurveTo(-L * 0.6, Hh * 0.12, -L * 0.76, Hh * (0.72 + wigTail));
    c.quadraticCurveTo(-L * 0.5, Hh * 0.16, -L * 0.36, 0);
  } else if (f.shape === 'dart' || f.shape === 'tank') {   // stiff crescent
    c.moveTo(-L * 0.38, 0);
    c.lineTo(-L * 0.52, -Hh * 0.1);
    c.quadraticCurveTo(-L * 0.56, -Hh * 0.34, -L * 0.78, -Hh * (0.7 - wigTail));
    c.quadraticCurveTo(-L * 0.6, 0, -L * 0.78, Hh * (0.7 + wigTail));
    c.quadraticCurveTo(-L * 0.56, Hh * 0.34, -L * 0.52, Hh * 0.1);
  } else if (f.shape === 'sail') {                          // slender sickle
    c.moveTo(-L * 0.38, 0);
    c.lineTo(-L * 0.5, -Hh * 0.08);
    c.quadraticCurveTo(-L * 0.52, -Hh * 0.4, -L * 0.82, -Hh * (0.85 - wigTail));
    c.quadraticCurveTo(-L * 0.58, 0, -L * 0.82, Hh * (0.85 + wigTail));
    c.quadraticCurveTo(-L * 0.52, Hh * 0.4, -L * 0.5, Hh * 0.08);
  } else {                                                  // puff: little fan
    c.moveTo(-L * 0.4, 0);
    c.quadraticCurveTo(-L * 0.62, -Hh * (0.3 - wigTail * 0.6), -L * 0.66, -Hh * (0.18 - wigTail));
    c.quadraticCurveTo(-L * 0.7, Hh * 0.02, -L * 0.66, Hh * (0.2 + wigTail));
    c.quadraticCurveTo(-L * 0.62, Hh * 0.32, -L * 0.4, 0);
  }
  c.closePath(); c.fill(); c.stroke();

  // sailfish bill, tucked under the head before the body goes down
  if (f.shape === 'sail') {
    c.fillStyle = sil ? SIL_FILL : mixHex(f.colors.body, FISH_INK, 0.2);
    c.beginPath();
    c.moveTo(L * 0.4, -Hh * 0.12);
    c.quadraticCurveTo(L * 0.7, -Hh * 0.1, L * 0.88, -Hh * 0.02);
    c.quadraticCurveTo(L * 0.7, Hh * 0.02, L * 0.4, Hh * 0.08);
    c.closePath(); c.fill(); c.stroke();
  }

  // ---- body ----
  c.fillStyle = sil ? SIL_FILL : fishBodyGrad(c, f, Hh);
  c.beginPath();
  if (f.shape === 'puff') {                 // a ball with lips
    c.ellipse(0, 0, L * 0.46, Hh * 0.72, 0, 0, TAU);
  } else if (f.shape === 'dart') {          // torpedo with a pointed snout
    c.moveTo(L * 0.58, 0);
    c.quadraticCurveTo(L * 0.3, -Hh * 0.58, -L * 0.02, -Hh * 0.55);
    c.quadraticCurveTo(-L * 0.3, -Hh * 0.48, -L * 0.42, -Hh * 0.14);
    c.lineTo(-L * 0.42, Hh * 0.12);
    c.quadraticCurveTo(-L * 0.3, Hh * 0.44, 0, Hh * 0.5);
    c.quadraticCurveTo(L * 0.34, Hh * 0.52, L * 0.58, 0);
  } else if (f.shape === 'tank') {          // deep heavy slab with a stout chin
    c.moveTo(L * 0.48, -Hh * 0.08);
    c.quadraticCurveTo(L * 0.3, -Hh * 0.66, -L * 0.02, -Hh * 0.62);
    c.quadraticCurveTo(-L * 0.3, -Hh * 0.52, -L * 0.38, -Hh * 0.14);
    c.lineTo(-L * 0.38, Hh * 0.12);
    c.quadraticCurveTo(-L * 0.3, Hh * 0.5, 0, Hh * 0.6);
    c.quadraticCurveTo(L * 0.3, Hh * 0.62, L * 0.46, Hh * 0.18);
    c.quadraticCurveTo(L * 0.52, Hh * 0.04, L * 0.48, -Hh * 0.08);
  } else if (f.shape === 'sail') {          // long and low-slung
    c.moveTo(L * 0.5, -Hh * 0.04);
    c.quadraticCurveTo(L * 0.26, -Hh * 0.56, -L * 0.04, -Hh * 0.54);
    c.quadraticCurveTo(-L * 0.3, -Hh * 0.48, -L * 0.42, -Hh * 0.14);
    c.lineTo(-L * 0.42, Hh * 0.12);
    c.quadraticCurveTo(-L * 0.28, Hh * 0.44, 0, Hh * 0.48);
    c.quadraticCurveTo(L * 0.3, Hh * 0.46, L * 0.5, Hh * 0.02);
  } else {                                  // slim/wing: streamlined sardine
    c.moveTo(L * 0.5, -Hh * 0.06);
    c.quadraticCurveTo(L * 0.3, -Hh * 0.6, L * 0.02, -Hh * 0.58);
    c.quadraticCurveTo(-L * 0.28, -Hh * 0.52, -L * 0.38, -Hh * 0.16);
    c.lineTo(-L * 0.38, Hh * 0.14);
    c.quadraticCurveTo(-L * 0.28, Hh * 0.46, 0, Hh * 0.52);
    c.quadraticCurveTo(L * 0.32, Hh * 0.5, L * 0.5, Hh * 0.04);
  }
  c.closePath(); c.fill(); c.stroke();

  // gill-cover arc + a few stable scale glints (skipped on silhouettes)
  if (!sil && f.shape !== 'puff') {
    c.globalAlpha = 0.45;
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(L * 0.2, -Hh * 0.34);
    c.quadraticCurveTo(L * 0.05, -Hh * 0.05, L * 0.18, Hh * 0.38);
    c.stroke();
    c.globalAlpha = 1;
    c.lineWidth = 2.5;
  }
  if (!sil) {
    c.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 4; i++) {
      const gx = lerp(-L * 0.24, L * 0.06, hash01(seed + i * 7.3));
      const gy = lerp(-Hh * 0.3, Hh * 0.16, hash01(seed + i * 3.7));
      c.beginPath(); c.ellipse(gx, gy, L * 0.045, L * 0.026, -0.4, 0, TAU); c.fill();
    }
  }

  if (f.shape === 'puff') { // spikes, extending while puffed (boost/sink)
    const ext = clamp(opts.spikeExt || 0, 0, 1);
    c.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * TAU + 0.3;
      c.beginPath();
      c.moveTo(Math.cos(a) * L * 0.44, Math.sin(a) * Hh * 0.68);
      c.lineTo(Math.cos(a) * L * (0.52 + 0.1 * ext), Math.sin(a) * Hh * (0.78 + 0.16 * ext));
      c.stroke();
    }
    c.lineWidth = 2.5;
  }
  if (f.shape === 'dart' && !sil) { // racing stripes
    c.strokeStyle = '#1f7a5f'; c.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      c.beginPath();
      c.moveTo(-L * 0.1 + i * 8, -Hh * 0.48);
      c.quadraticCurveTo(-L * 0.02 + i * 8, 0, -L * 0.1 + i * 8, Hh * 0.46);
      c.stroke();
    }
    c.strokeStyle = ink; c.lineWidth = 2.5;
  }
  if (f.shape === 'tank') { // ridge of little tuna finlets along the back
    c.fillStyle = sil ? SIL_FILL : '#ffd93b';
    const spots = [[-0.06, -0.6], [-0.13, -0.53], [-0.2, -0.45], [-0.27, -0.36], [-0.33, -0.27]];
    for (const [px, py] of spots) {
      c.beginPath();
      c.moveTo(L * px, Hh * py);
      c.lineTo(L * (px - 0.045), Hh * (py - 0.14));
      c.lineTo(L * (px - 0.06), Hh * (py + 0.02));
      c.closePath(); c.fill(); c.stroke();
    }
  }

  // ---- pectoral fin (huge double-layer wing for the flying fish) ----
  c.fillStyle = finCol;
  if (f.shape === 'wing') {
    c.fillStyle = sil ? SIL_FILL : mixHex(f.colors.fin, FISH_INK, 0.3);
    c.beginPath(); // under-wing, a darker layer peeking out behind
    c.moveTo(-L * 0.02, -Hh * 0.15);
    c.quadraticCurveTo(-L * 0.45, -Hh * (1.5 + wig * 2), -L * 0.78, -Hh * (0.9 + wig * 2));
    c.quadraticCurveTo(-L * 0.36, -Hh * 0.35, -L * 0.02, -Hh * 0.15);
    c.fill(); c.stroke();
    c.fillStyle = finCol;
    c.beginPath();
    c.moveTo(-L * 0.05, -Hh * 0.2);
    c.quadraticCurveTo(-L * 0.5, -Hh * (1.7 + wig * 2), -L * 0.85, -Hh * (1.1 + wig * 2));
    c.quadraticCurveTo(-L * 0.4, -Hh * 0.45, -L * 0.05, -Hh * 0.2);
    c.fill(); c.stroke();
    if (!sil) { // membrane ribs fanning through the wing
      c.lineWidth = 1.5; c.globalAlpha = 0.45;
      for (let i = 1; i <= 3; i++) {
        const tt = i / 4;
        c.beginPath();
        c.moveTo(-L * 0.05, -Hh * 0.2);
        c.quadraticCurveTo(
          lerp(-L * 0.18, -L * 0.42, tt), -Hh * (0.4 + tt * (1.1 + wig * 2)),
          lerp(-L * 0.3, -L * 0.8, tt), -Hh * (0.45 + tt * (0.62 + wig * 2)));
        c.stroke();
      }
      c.globalAlpha = 1; c.lineWidth = 2.5;
    }
  } else {
    c.beginPath();
    c.moveTo(L * 0.05, Hh * 0.15);
    c.quadraticCurveTo(-L * 0.15, Hh * (0.55 + wig), -L * 0.2, Hh * 0.3);
    c.quadraticCurveTo(-L * 0.05, Hh * 0.1, L * 0.05, Hh * 0.15);
    c.fill(); c.stroke();
  }

  // ---- dorsal fin ----
  c.fillStyle = finCol;
  if (f.shape === 'sail') { // the dramatic sail, with ribs and spots
    c.beginPath();
    c.moveTo(-L * 0.2, -Hh * 0.45);
    c.quadraticCurveTo(-L * 0.04, -Hh * (2.2 + wig * 3), L * 0.16, -Hh * 0.5);
    c.quadraticCurveTo(-L * 0.02, -Hh * 0.7, -L * 0.2, -Hh * 0.45);
    c.fill(); c.stroke();
    if (!sil) {
      c.lineWidth = 1.5; c.globalAlpha = 0.4;
      for (let i = 1; i <= 3; i++) {
        const tt = i / 4;
        c.beginPath();
        c.moveTo(lerp(-L * 0.16, L * 0.12, tt), -Hh * 0.52);
        c.lineTo(lerp(-L * 0.14, L * 0.08, tt), -Hh * (0.52 + (1.9 - Math.abs(tt - 0.5) * 1.6) * (1 + wig)));
        c.stroke();
      }
      c.globalAlpha = 1; c.lineWidth = 2.5;
      c.fillStyle = 'rgba(20,32,52,0.35)';
      for (let i = 0; i < 5; i++) {
        const sx2 = lerp(-L * 0.12, L * 0.08, hash01(seed + 40 + i * 5.1));
        const sy2 = -Hh * lerp(0.7, 1.5, hash01(seed + 60 + i * 3.3));
        c.beginPath(); c.arc(sx2, sy2, L * 0.022, 0, TAU); c.fill();
      }
    }
  } else if (f.shape === 'tank') { // stiff pointed dorsal
    c.beginPath();
    c.moveTo(L * 0.02, -Hh * 0.62);
    c.lineTo(-L * 0.05, -Hh * (0.98 + wig * 0.5));
    c.lineTo(-L * 0.17, -Hh * 0.5);
    c.closePath(); c.fill(); c.stroke();
  } else if (f.shape !== 'puff') { // soft curved dorsal
    c.beginPath();
    c.moveTo(-L * 0.02, -Hh * 0.56);
    c.quadraticCurveTo(-L * 0.2, -Hh * (0.95 + wig), -L * 0.28, -Hh * 0.48);
    c.fill(); c.stroke();
  }

  // ---- face ----
  if (!sil) {
    const eyeX = (f.shape === 'dart' || f.shape === 'sail') ? L * 0.3 : L * 0.26;
    const eyeY = -Hh * (f.shape === 'tank' ? 0.22 : 0.16);
    const eyeR = L * (opts.nervous ? 0.12 : 0.1);
    if (opts.blink) { // mid-blink: a happy closed-eye arc
      c.strokeStyle = FISH_INK; c.lineWidth = 2.5;
      c.beginPath(); c.arc(eyeX, eyeY + eyeR * 0.2, eyeR * 0.7, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
    } else {
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(eyeX, eyeY, eyeR, 0, TAU); c.fill(); c.stroke();
      const pa = opts.pupilA ?? 0; // pupil looks along this angle (default: ahead)
      const pr = L * (opts.nervous ? 0.05 : 0.035);
      c.fillStyle = FISH_INK;
      c.beginPath();
      c.arc(eyeX + Math.cos(pa) * pr, eyeY - Math.sin(pa) * pr, L * (opts.nervous ? 0.035 : 0.045), 0, TAU);
      c.fill();
    }
    const mouthX = (f.shape === 'dart' || f.shape === 'sail') ? L * 0.36 : L * 0.3;
    if (opts.mouthOpen) { // open wide — boosting or about to chomp a snack
      c.fillStyle = '#7c1f3d';
      c.beginPath(); c.ellipse(mouthX, Hh * 0.16, L * 0.06, L * 0.08, 0.25, 0, TAU); c.fill(); c.stroke();
    } else {
      c.strokeStyle = FISH_INK;
      c.beginPath(); c.arc(mouthX, Hh * 0.12, L * 0.12, 0.2, Math.PI * 0.7); c.stroke();
    }
    if (opts.worried) { // X eyes when sinking
      c.fillStyle = '#fff';
      c.fillRect(L * 0.16, -Hh * 0.3, L * 0.2, Hh * 0.28);
      c.strokeStyle = FISH_INK; c.lineWidth = 2;
      const ex = L * 0.26, ey = -Hh * 0.16, r = L * 0.06;
      c.beginPath();
      c.moveTo(ex - r, ey - r); c.lineTo(ex + r, ey + r);
      c.moveTo(ex + r, ey - r); c.lineTo(ex - r, ey + r);
      c.stroke();
    }
  }
}

// motion-trail ribbon: drawn in plain screen space (not the fish's rotated
// local frame) since it's a history of past world positions, not part of
// the fish's own silhouette
function drawFishTrail() {
  if (REDUCED_MOTION || run.trail.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round';
  const n = run.trail.length;
  for (let i = 1; i < n; i++) {
    const a = run.trail[i - 1], b = run.trail[i];
    const age = i / n; // 0 = oldest, 1 = newest
    const width = fishDef.size * 0.42 * age;
    if (width < 0.6) continue;
    ctx.lineWidth = width;
    ctx.strokeStyle = fishDef.colors.body;
    ctx.globalAlpha = 0.2 * age;
    ctx.beginPath();
    ctx.moveTo(w2sx(a.x), w2sy(a.y));
    ctx.lineTo(w2sx(b.x), w2sy(b.y));
    ctx.stroke();
    if (b.sp > 1400) { // additive white core at high speed
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = 0.3 * age * clamp((b.sp - 1400) / 700, 0, 1);
      ctx.lineWidth = width * 0.35;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// nearest uneaten food ahead of/beside the fish — used only to give the
// pupils something to glance toward; returns the food's world-y offset
// from the fish (positive = above) or null if nothing qualifies
function nearestFoodDy() {
  let bestD = Infinity, bestDy = null;
  for (const f of foods) {
    if (f.taken) continue;
    const dx = f.x - run.x;
    if (dx < -20 || dx > 260) continue;
    const s0 = surfaceAt(f.x, time);
    const fy = s0.y + f.baseY + Math.sin(time * 2 + f.phase) * 6;
    const dy = fy - run.y;
    const d = Math.hypot(dx, dy);
    if (d < bestD) { bestD = d; bestDy = dy; }
  }
  return bestD < 260 ? bestDy : null;
}

// per-fish blink cadence: one ~0.12s blink every ~2.6-3.6s, timed
// differently per fish (hash01 offset) so a school wouldn't blink in sync
function isBlinking(fishSeed) {
  const period = 2.6 + hash01(fishSeed + 11.1) * 1.0;
  const cycle = Math.floor(time / period);
  const phase = time - cycle * period;
  const blinkAt = 0.3 + hash01(cycle * 17.3 + fishSeed) * (period - 0.6);
  return Math.abs(phase - blinkAt) < 0.06;
}

// two-layer chili-flame cone, drawn in the fish's rotated local frame
// (local -x = behind the tail), with a hash01-driven flicker so it doesn't
// look like a static decal
function drawBoostFlame(size) {
  const flick = 0.85 + 0.3 * hash01(Math.floor(time * 30));
  const len = size * (0.9 + 0.3 * hash01(Math.floor(time * 22) + 5.5)) * flick;
  const baseX = -size * 0.62, w = size * 0.22;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#ff7a1a';
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.moveTo(baseX, -w); ctx.quadraticCurveTo(baseX - len, 0, baseX, w);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe066';
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(baseX, -w * 0.5); ctx.quadraticCurveTo(baseX - len * 0.6, 0, baseX, w * 0.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// short streaks trailing behind the fish (local -x, post-rotation) when
// airspeed clears SPEED_LINES_MIN — hash01-seeded on a coarse time bucket so
// they hold still for a few frames rather than jittering every draw
function drawSpeedLines(speed, size) {
  const bucket = Math.floor(time * 16);
  const strength = clamp((speed - SPEED_LINES_MIN) / 900, 0, 1);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineCap = 'round';
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 4; i++) {
    const s1 = hash01(bucket * 3.1 + i * 7.7), s2 = hash01(bucket * 3.1 + i * 7.7 + 1.3);
    const yOff = (s1 - 0.5) * size * 1.5;
    const startX = -size * (0.55 + s2 * 0.35);
    const len = size * (0.35 + strength * 0.4);
    ctx.globalAlpha = 0.35 + strength * 0.35;
    ctx.beginPath();
    ctx.moveTo(startX, yOff);
    ctx.lineTo(startX - len, yOff);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFish() {
  if (state === 'menu' || state === 'shop' || state === 'done') return;
  drawFishTrail();
  const speed = state === 'fly' ? Math.hypot(run.vx, run.vy) : 0;
  ctx.save();
  ctx.translate(w2sx(run.x), w2sy(run.y));
  let ang = 0;
  if (state === 'toss') ang = time * 6;                     // tumbling in the toss
  else if (state === 'sink') ang = Math.sin(run.spinning) * 0.6 + 0.5;
  else if (state === 'fly') ang = -Math.atan2(run.vy, Math.max(80, run.vx));
  ctx.rotate(ang);

  // boost flame, drawn behind the tail (local -x) before the body
  if (state === 'fly' && held && run.energy > 0) drawBoostFlame(fishDef.size);

  // squash & stretch: modest stretch at speed, a sharp squash pulse right
  // after an impact (swing contact or a bounce) that eases out over ~0.12s
  const stretch = clamp(speed / 2600, 0, 0.2);
  const squashPulse = run.squashT >= 0 ? 0.5 * Math.exp(-(time - run.squashT) / 0.12) : 0;
  const sq = clamp(stretch - squashPulse, -0.4, 0.22);
  ctx.scale(1 + sq, 1 - sq * 0.8);

  if (!REDUCED_MOTION && speed > SPEED_LINES_MIN) drawSpeedLines(speed, fishDef.size);

  if (state === 'sink') ctx.globalAlpha = clamp(1.2 - run.sinkT * 0.55, 0.25, 1);

  const st2 = state === 'fly' ? stats() : null;
  const surf2 = state === 'fly' ? surfaceAt(run.x, time) : null;
  const nervous = state === 'fly' && st2 && speed < st2.minSkim * 1.15 && (run.y - surf2.y) < 90;
  const foodDy = state === 'fly' ? nearestFoodDy() : null;
  const opts = {
    worried: state === 'sink',
    nervous,
    blink: state === 'fly' && !nervous && isBlinking(fishDef.id.charCodeAt(0)),
    pupilA: foodDy != null ? clamp(foodDy / 140, -1, 1) * 0.5 : 0,
    mouthOpen: state === 'fly' && ((held && run.energy > 0) || (foodDy != null && Math.abs(foodDy) < 60)),
    speed,
    spikeExt: state === 'sink' ? 1 : clamp((speed - 900) / 1400, 0, 1),
  };
  drawFishShape(ctx, fishDef, run.wiggle, opts);
  if (state === 'sink' && assets.caustics.loaded) {
    // caustic dapples projected onto the sinking fish — same scrolling
    // pattern as drawSea's water layer, 'multiply'-blended so it reads as
    // light rippling over the fish rather than a flat texture stamp
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.35;
    const r = fishDef.size * 0.75;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.7, 0, 0, TAU); ctx.clip();
    const pat = ctx.createPattern(assets.caustics.el, 'repeat');
    if (pat) {
      const scale = 0.5;
      const tile = assets.caustics.el.width * scale;
      const m = new DOMMatrix()
        .translate(-((cam.x * 0.5 + time * 14) % tile), (time * 6) % tile)
        .scale(scale, scale);
      pat.setTransform(m);
      ctx.fillStyle = pat;
      ctx.fillRect(-r, -r, r * 2, r * 2);
    }
    ctx.restore();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawSinkOverlay() {
  // depth-fog vignette that deepens as the sink animation progresses, so the
  // run's ending reads as sinking into darkness rather than just fading out
  const t = clamp(run.sinkT / 1.5, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(2,10,20,0)');
  g.addColorStop(1, `rgba(2,10,20,${0.55 * t})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSweetRing() {
  if (state !== 'toss' && state !== 'ready') return;
  const sx = w2sx(BAT_X + 40), sy = w2sy(SWEET_Y);
  const pulse = 1 + Math.sin(time * 6) * 0.08;
  ctx.strokeStyle = state === 'toss' ? '#ffd93b' : '#ffffff88';
  ctx.lineWidth = 5;
  ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.arc(sx, sy, 34 * pulse, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  if (state === 'toss') {
    ctx.fillStyle = '#ffd93b';
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🎯', sx, sy + 5);
    ctx.textAlign = 'left';
  }
}

// deterministic pseudo-random in [0,1) for a given number — used so kelp
// placement/variant/phase stay stable across frames (Math.random() would
// reroll every frame since these are recomputed each render)
function hash01(n) {
  const s = Math.sin(n * 12.9898) * 43758.5453;
  return s - Math.floor(s);
}

function drawKelpBeds(pal) {
  const img1 = assets.kelpFrond1, img2 = assets.kelpFrond2;
  if (!img1?.loaded || !img2?.loaded) return; // no procedural fallback — beds just don't appear yet
  const SPACING = 130;
  const first = Math.floor(cam.x / SPACING) - 1;
  const count = Math.ceil(W / SPACING) + 2;
  const density = clamp(pal.light * 1.05, 0.08, 1); // lush near the beach, sparse far out
  for (let i = 0; i < count; i++) {
    const slot = first + i;
    const slotX = slot * SPACING;
    if (hash01(slot) > density) continue;
    const jitterX = (hash01(slot * 3.1) - 0.5) * SPACING * 0.7;
    const worldX = slotX + jitterX;
    const img = hash01(slot * 7.7) > 0.5 ? img1 : img2;
    const scale = 0.6 + hash01(slot * 5.3) * 0.55;
    const rooty = -(90 + hash01(slot * 2.3) * 70); // world y: a bit below calm sea level
    const phase = hash01(slot * 9.1) * TAU;
    const s = surfaceAt(worldX, time);
    const sway = Math.sin(time * 0.6 + phase) * 0.16 + clamp(s.vy * 0.0004, -0.12, 0.12);
    const sx = w2sx(worldX), sy = w2sy(rooty);
    if (sx < -60 || sx > W + 60) continue;
    const w = img.el.width * scale, h = img.el.height * scale;
    ctx.save();
    ctx.globalAlpha = clamp(0.55 + density * 0.45, 0.5, 1);
    ctx.translate(sx, sy);
    ctx.rotate(sway);
    ctx.drawImage(img.el, -w / 2, -h, w, h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawGodRays(pal) {
  const img = assets.rayBrush;
  if (!img?.loaded) return;
  const intensity = clamp(pal.light, 0, 1);
  if (intensity < 0.08) return; // too dark out here for visible rays
  const SPACING = 300;
  const first = Math.floor(cam.x / SPACING) - 1;
  const count = Math.ceil(W / SPACING) + 2;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < count; i++) {
    const slot = first + i;
    const worldX = slot * SPACING + Math.sin(slot * 1.7) * 60;
    const sx = w2sx(worldX);
    if (sx < -140 || sx > W + 140) continue;
    const pulse = 0.6 + 0.4 * Math.sin(time * 0.3 + slot * 2.1);
    const scale = 1.3 + hash01(slot * 4.4) * 1.1;
    const w = img.el.width * scale, h = img.el.height * scale;
    ctx.save();
    ctx.globalAlpha = clamp(intensity * 0.62 * pulse, 0, 0.55);
    ctx.translate(sx, clamp(w2sy(30), -200, H));
    ctx.rotate(0.12);
    ctx.drawImage(img.el, -w / 2, 0, w, h);
    ctx.restore();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawCausticsLayer(scale, speedX, speedY, alpha, top, bottom) {
  const img = assets.caustics.el;
  const pat = ctx.createPattern(img, 'repeat');
  if (!pat) return;
  const tileW = img.width * scale, tileH = img.height * scale;
  const offX = -((cam.x * 0.5 + time * speedX) % tileW);
  const offY = (time * speedY) % tileH;
  const m = new DOMMatrix().translate(offX, offY).scale(scale, scale);
  pat.setTransform(m);
  ctx.fillStyle = pat;
  ctx.globalAlpha = alpha;
  ctx.fillRect(0, top, W, bottom - top);
}

function drawSea(pal) {
  const step = 8;
  // back swell layer for depth
  ctx.fillStyle = pal.seaD;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W + step; sx += step) {
    const s = surfaceAt(sx + cam.x + 60, time + 0.7);
    ctx.lineTo(sx, w2sy(s.y * 0.9) - 12);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // main water
  const top = [];
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W + step; sx += step) {
    const s = surfaceAt(sx + cam.x, time);
    const sy = w2sy(s.y);
    top.push([sx, sy]);
    ctx.lineTo(sx, sy);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  // multi-stop depth gradient: sun-glow surface → shallow → mid → deep → abyss
  const topY = clamp(w2sy(30), -200, H);
  const glow = mixHex(pal.seaT, '#ffffff', 0.32);
  const mid = mixHex(pal.seaT, pal.seaD, 0.45);
  const deep = mixHex(pal.seaT, pal.seaD, 0.78);
  const g = ctx.createLinearGradient(0, topY, 0, H);
  g.addColorStop(0, glow);
  g.addColorStop(0.1, pal.seaT);
  g.addColorStop(0.5, mid);
  g.addColorStop(0.82, deep);
  g.addColorStop(1, pal.seaD);
  ctx.fillStyle = g;
  ctx.fill();

  // everything below this clip stays confined to the water polygon just built
  ctx.save();
  ctx.clip();
  drawKelpBeds(pal);
  if (quality.rays) drawGodRays(pal);
  if (assets.caustics.loaded) {
    drawCausticsLayer(1.7, 14, 6, clamp(pal.light * 0.14, 0.015, 0.14), topY, H);
    if (quality.causticsLayer2) drawCausticsLayer(2.8, -9, 4, clamp(pal.light * 0.08, 0.01, 0.08), topY, H);
  }
  ctx.restore();

  // foam line + crest highlights
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < top.length; i++) {
    if (i === 0) ctx.moveTo(top[i][0], top[i][1]); else ctx.lineTo(top[i][0], top[i][1]);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i = 0; i < top.length; i += 4) {
    const s = surfaceAt(top[i][0] + cam.x, time);
    if (s.slope > 0.06) { ctx.moveTo(top[i][0], top[i][1] + 5); ctx.lineTo(top[i][0] + 14, top[i][1] + 7); }
  }
  ctx.stroke();

  // sun-glint band: small twinkling specular dots on wave faces angled toward
  // the sun (upper-right, per drawSky) — hash01(x,t) gives each face its own
  // flicker without any per-particle state to track
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < top.length; i += 3) {
    const wx = top[i][0] + cam.x;
    const gs = surfaceAt(wx, time);
    if (gs.slope < 0.015 || gs.slope > 0.4) continue;
    const tw = hash01(Math.floor(wx / 22) * 7.3 + Math.floor(time * 2.2));
    if (tw < 0.82) continue;
    ctx.globalAlpha = clamp(pal.light, 0, 1) * (0.4 + 0.6 * hash01(wx * 0.7 + Math.floor(time * 6)));
    ctx.beginPath(); ctx.arc(top[i][0], top[i][1] - 1, 1.4, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawFoamPatches();

  // whitecap foam on sharp crests — a cusp shows up as a strong local second
  // difference, which smooth sine tops never reach. Uses the generated foam
  // stamps when loaded, falling back to the original plain flecks.
  const foamReady = assets.foamStamp1?.loaded && assets.foamStamp2?.loaded;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 2; i < top.length - 2; i++) {
    const bump = (top[i - 2][1] + top[i + 2][1]) / 2 - top[i][1];
    if (bump <= 4) continue;
    if (foamReady) {
      const img = hash01(Math.floor((top[i][0] + cam.x) / 40)) > 0.5 ? assets.foamStamp1 : assets.foamStamp2;
      const scale = clamp(bump / 13, 0.4, 1.15);
      const w = img.el.width * scale, h = img.el.height * scale;
      ctx.save();
      ctx.globalAlpha = clamp(bump / 9, 0.55, 1);
      ctx.drawImage(img.el, top[i][0] - w / 2, top[i][1] - h * 0.55, w, h);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else {
      ctx.beginPath();
      ctx.arc(top[i][0], top[i][1] + 1, clamp(bump * 0.35, 2, 5), 0, TAU);
      ctx.fill();
    }
  }
}

// persistent foam patches left behind by each skip — ride the wave surface,
// spread, and fade over ~2s, giving a readable trail of the skip chain
function drawFoamPatches() {
  if (!foamPatches.length) return;
  const foamReady = assets.foamStamp1?.loaded && assets.foamStamp2?.loaded;
  for (const f of foamPatches) {
    const age = time - f.born;
    const t = clamp(age / 2, 0, 1);
    const s = surfaceAt(f.x, time);
    const sx = w2sx(f.x), sy = w2sy(s.y);
    if (sx < -60 || sx > W + 60) continue;
    const alpha = (1 - t) * 0.8;
    const size = f.size * (1 + t * 0.9);
    if (foamReady) {
      const img = hash01(Math.floor(f.x / 20)) > 0.5 ? assets.foamStamp1 : assets.foamStamp2;
      const w = img.el.width * (size / 24), h = img.el.height * (size / 24);
      ctx.globalAlpha = alpha;
      ctx.drawImage(img.el, sx - w / 2, sy - h * 0.5, w, h);
    } else {
      ctx.globalAlpha = alpha * 0.7;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(sx, sy, size, size * 0.4, 0, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFoods() {
  for (const f of foods) {
    if (f.taken) continue;
    const sx = w2sx(f.x);
    if (sx < -40 || sx > W + 40) continue;
    const s = surfaceAt(f.x, time);
    const sy = w2sy(s.y + f.baseY + Math.sin(time * 2 + f.phase) * 6);
    const r = 10;
    ctx.fillStyle = 'rgba(255,217,59,0.25)';
    ctx.beginPath(); ctx.arc(sx, sy, r + 7 + Math.sin(time * 4 + f.phase) * 2, 0, TAU); ctx.fill();
    const g = ctx.createRadialGradient(sx - 3, sy - 3, 1, sx, sy, r);
    g.addColorStop(0, '#fff6cf'); g.addColorStop(0.4, '#ffd93b'); g.addColorStop(1, '#e09b12');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a56d00'; ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawParticles() {
  for (const p of particles) {
    const sx = w2sx(p.x), sy = w2sy(p.y);
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    if (p.kind === 'bubble') {
      ctx.globalAlpha *= 0.8;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sx, sy, p.size, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(sx - p.size * 0.3, sy + p.size * 0.3, p.size * 0.28, 0, TAU); ctx.fill();
    } else if (p.kind === 'ring') {
      const t = 1 - p.life / p.maxLife;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(sx, sy, p.size * (0.3 + t * 0.9), 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(sx, sy, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    const a = clamp(1 - p.t / p.life, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `bold ${p.size}px 'Comic Sans MS', sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#1e2a3aa8';
    ctx.strokeText(p.str, w2sx(p.x), w2sy(p.y));
    ctx.fillStyle = p.color;
    ctx.fillText(p.str, w2sx(p.x), w2sy(p.y));
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawGustFronts() {
  for (const g of gustEvents) {
    if (g.triggered) continue;
    const sx = w2sx(g.x);
    if (sx < -60 || sx > W + 60) continue;
    const shimmer = 0.12 + 0.09 * Math.sin(time * 8 + g.x * 0.01);
    ctx.fillStyle = `rgba(255,255,255,${shimmer.toFixed(3)})`;
    ctx.fillRect(sx - 6, 0, 12, H);
  }
}
function drawThermals() {
  for (const th of thermals) {
    const sx = w2sx(th.x);
    if (sx < -th.width || sx > W + th.width) continue;
    const wobble = Math.sin(time * 3 + th.x * 0.02) * 8;
    const g = ctx.createLinearGradient(sx - th.width / 2, 0, sx + th.width / 2, 0);
    g.addColorStop(0, 'rgba(255,200,120,0)');
    g.addColorStop(0.5, 'rgba(255,200,120,0.10)');
    g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = g;
    ctx.fillRect(sx - th.width / 2 + wobble, 0, th.width, H);
  }
}

function render() {
  const lookX = (state === 'fly' || state === 'sink') ? run.x : cam.x + W * 0.4;
  const pal = paletteAt(lookX);
  drawSky(pal);
  drawSea(pal);
  drawBeach();
  if (!REDUCED_MOTION && (state === 'fly' || state === 'sink')) { drawGustFronts(); drawThermals(); }
  drawLuchador();
  drawPicado();      // behind the action so the ring and fish stay readable
  drawSweetRing();
  drawFoods();
  drawFish();
  if (state === 'sink') drawSinkOverlay();
  drawParticles();
}

/* ---------- HUD / screens ---------- */
const $ = (id) => document.getElementById(id);
function showScreen(name) {
  for (const id of ['menu', 'shop', 'results']) $(id).classList.toggle('hidden', id !== name);
}
function hud(on) {
  $('hud').classList.toggle('hidden', !on);
  $('hint').classList.toggle('hidden', !on);
  $('energy').classList.toggle('hidden', !on);
}
function setHint(t) { $('hint').textContent = t; }
let hudTick = 0;
function updateHud() {
  if ((hudTick++ & 3) !== 0) return;
  $('hudDist').textContent = Math.round(run.dist / PX_PER_M) + ' m';
  const kmh = Math.round(Math.hypot(run.vx, run.vy) * 3.6 / PX_PER_M);
  $('hudSpeed').innerHTML = (state === 'fly' ? kmh : 0) + ' <small>km/h</small>';
  $('hudFood').textContent = '🟡 ' + run.food;
  $('efill').style.width = (run.energy / run.maxEnergy * 100) + '%';
  // chili meter only matters once the fish is airborne
  $('energy').classList.toggle('hidden', state !== 'fly' && state !== 'sink');
  const windKmh = Math.round(Math.abs(wind.base) * 3.6 / PX_PER_M);
  const showWind = Math.abs(wind.base) >= 25;
  $('hudWind').classList.toggle('hidden', !showWind);
  if (showWind) $('hudWind').textContent = (wind.dir > 0 ? '💨→ ' : '💨← ') + windKmh;
}

/* ---------- menu / shop ---------- */
function buildMenu() {
  const wrap = $('fishCards');
  wrap.innerHTML = '';
  for (const f of FISH) {
    const card = document.createElement('div');
    card.className = 'card' + (f.id === fishDef.id ? ' sel' : '');
    card.innerHTML = `
      <h3>${f.name}</h3><div class="species">${f.species}</div>
      <canvas width="104" height="58"></canvas>
      <div class="stat"><b>power</b><div class="bar"><i style="width:${Math.round(f.power / 1.3 * 100)}%"></i></div></div>
      <div class="stat"><b>bounce</b><div class="bar"><i style="width:${Math.round(f.bounce / 0.85 * 100)}%"></i></div></div>
      <div class="stat"><b>aero</b><div class="bar"><i style="width:${Math.round((1 - f.drag / 0.18) * 100)}%"></i></div></div>
      <div class="stat"><b>sea legs</b><div class="bar"><i style="width:${Math.round(f.seaLegs * 100)}%"></i></div></div>
      <div class="blurb">${f.blurb}</div>`;
    card.addEventListener('click', () => {
      fishDef = f; save.fish = f.id; persist(); sfx.click();
      for (const c of wrap.children) c.classList.remove('sel');
      card.classList.add('sel');
    });
    wrap.appendChild(card);
    const cv = card.querySelector('canvas');
    const mc = cv.getContext('2d');
    const portrait = assets['portrait' + f.id[0].toUpperCase() + f.id.slice(1)];
    if (portrait?.loaded) {
      mc.drawImage(portrait.el, 0, 0, cv.width, cv.height);
    } else {
      mc.translate(52, 30);
      mc.scale(0.9, 0.9);
      drawFishShape(mc, f, 0.4, {});
    }
  }
  refreshMenuStats();
}
function windLabel() {
  const mag = Math.abs(wind.base);
  const dirWord = wind.dir > 0 ? 'tailwind' : 'headwind';
  if (mag < 40) return 'Dead calm today 🌊';
  if (mag < 90) return `Light ${dirWord} today 💨`;
  if (mag < 160) return `Fresh ${dirWord} today 💨💨`;
  return `STRONG ${dirWord} today 💨💨💨`;
}
function refreshMenuStats() {
  $('menuStats').textContent = `🏆 best: ${save.best} m · 🟡 ${save.food} · runs: ${save.runs} · ${windLabel()}`;
}
function buildShop() {
  $('shopFood').textContent = `🟡 ${save.food} fish food`;
  const rows = $('upRows');
  rows.innerHTML = '';
  for (const u of UPGRADES) {
    const lvl = save.up[u.id];
    const row = document.createElement('div');
    row.className = 'uprow';
    const pips = Array.from({ length: UP_MAX }, (_, i) => `<span class="pip${i < lvl ? ' on' : ''}"></span>`).join('');
    const maxed = lvl >= UP_MAX;
    const cost = upCost(lvl);
    row.innerHTML = `
      <span style="font-size:20px">${u.icon}</span>
      <div class="nm"><b>${u.name}</b><small>${u.desc}</small></div>
      <div class="pips">${pips}</div>
      <button class="buy" ${maxed || save.food < cost ? 'disabled' : ''}>${maxed ? 'MAX' : '🟡 ' + cost}</button>`;
    if (!maxed) {
      row.querySelector('.buy').addEventListener('click', () => {
        if (save.food < cost) { sfx.nope(); return; }
        save.food -= cost; save.up[u.id]++;
        persist(); sfx.buy(); buildShop();
      });
    }
    rows.appendChild(row);
  }
}

/* ---------- input: one finger does everything ---------- */
function press() {
  audio();
  if (state === 'ready') toss();
  else if (state === 'toss') swing();
  else if (state === 'fly') held = true;
}
function release() { held = false; }
cvs.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

/* iOS Safari ignores user-scalable=no, so kill its zoom gestures by hand:
   pinch (gesture* + multi-touch move) and double-tap (quick second touchend).
   Interactive elements are exempt from the double-tap guard so rapid
   button-mashing on "Play again" still clicks. */
for (const ev of ['gesturestart', 'gesturechange', 'gestureend'])
  document.addEventListener(ev, (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = performance.now();
  if (now - lastTouchEnd < 350 && !e.target.closest('button, .card, .cards, .panel'))
    e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'done') { startRun(); sfx.click(); return; }
    if (state === 'menu' && !$('menu').classList.contains('hidden')) { startRun(); sfx.click(); return; }
    press();
  }
  if (e.code === 'Escape' && (state === 'ready' || state === 'toss' || state === 'done')) {
    state = 'menu'; hud(false); buildMenu(); showScreen('menu');
  }
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'Enter') release(); });

$('playBtn').addEventListener('click', () => { audio(); sfx.click(); startRun(); });
$('shopBtn').addEventListener('click', () => { audio(); sfx.click(); state = 'shop'; buildShop(); showScreen('shop'); });
$('shopBack').addEventListener('click', () => { sfx.click(); state = 'menu'; refreshMenuStats(); showScreen('menu'); });
$('againBtn').addEventListener('click', () => { sfx.click(); startRun(); });
$('menuBtn').addEventListener('click', () => { sfx.click(); state = 'menu'; buildMenu(); showScreen('menu'); });
$('muteBtn').addEventListener('click', () => {
  save.muted = !save.muted; persist();
  $('muteBtn').textContent = save.muted ? '🔇' : '🔊';
});
$('muteBtn').textContent = save.muted ? '🔇' : '🔊';
$('fsBtn').addEventListener('click', () => {
  const el = document.documentElement;
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); }
  else if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); }
});

/* ---------- main loop ---------- */
const FIXED_STEPS_MAX = 40;
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  time += dt;
  updateQualityScaler(dt * 1000);

  // hitstop: a brief freeze-frame on solid bat contact — physics (and
  // anything driven by it, like the swing clock and the fish's wiggle)
  // pauses for a beat while camera shake/dust keep animating, so the hit
  // reads as a real impact rather than a continuous blur through it
  if (hitstopT > 0) {
    hitstopT = Math.max(0, hitstopT - dt);
  } else {
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard++ < FIXED_STEPS_MAX) {
      stepPhysics(FIXED);
      acc -= FIXED;
    }
  }
  stepCamera(dt);
  spawnFoodAhead();
  spawnGustsAhead();
  spawnThermalsAhead();
  stepBubbleColumns(dt);
  stepWindStreaks(dt);
  stepParticles(dt);
  render();
  updateHud();
  requestAnimationFrame(frame);
}

buildMenu();
showScreen('menu');
requestAnimationFrame(frame);

// peek + camera warp for smoke tests / tuning from the console
window.OceanSkips = {
  get state() { return state; },
  get snapshot() {
    return { state, x: run.x, y: run.y, vx: run.vx, vy: run.vy,
             dist: run.dist, skips: run.skips, energy: run.energy };
  },
  get view() {
    return { W, H, VS, DPR, seaLine: seaLine(), camX: cam.x, camY: cam.y,
             tossApex: TOSS_Y + 83 };
  },
  roughAt, surfaceAt, levelInfoAt,   // exposed for wave-tuning tests
  WAVE_LEVELS, PX_PER_LEVEL, LEVELS_PER_CYCLE, PX_PER_CYCLE, CYCLE_GROWTH, LEVEL_BLEND_PX,
  introParamsAt, INTRO_PX,   // exposed for intro-ramp tuning tests
  effectiveWavelen, MIN_WAVES_PER_SCREEN, WAVE_IRREGULARITY, roughnessMod, irregAmtFor,
  get W() { return W; },   // exposed for wavelength-floor tests (real viewport width)
  BOOST_ACC, BOOST_DIVE, BOOST_DRAIN,   // exposed for boost-dive tests
  windAt, wind, rollWind, stats, shelterTopAt,   // exposed for wind-tuning tests
  get windStreaks() { return windStreaks.map(s => ({ ...s })); },   // debug only
  get flightEvents() {
    return { gustEvents: gustEvents.map(g => ({ ...g })), thermals: thermals.map(t => ({ ...t })), gustBoostT };
  },
  get bigAirCount() { return bigAirCount; },
  get particleCount() { return particles.length; },
  quality, updateQualityScaler, PARTICLE_CAP, REDUCED_MOTION, windLabel,   // exposed for perf/meta tests
  get audioLog() { return audioLog.slice(); },
  clearAudioLog() { audioLog = []; },
  sfx, updateWindAudio,   // exposed for audio-tuning tests
  selectFish(id) { const f = FISH.find(x => x.id === id); if (f) { fishDef = f; save.fish = f.id; } },
  warp(x) { cam.x = x; menuWrapLimit = Math.max(4200, x + 8000); },
};

/* ---------- cache-busting service worker ---------- */
// serviceWorker.register() throws under file:// (used by the headless
// layout tests and by anyone opening this file straight off disk) — only
// register when actually served over http(s).
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // controllerchange fires when a new sw.js version takes over; reload once
  // so the fresh build shows up immediately instead of needing a second
  // visit. Skip it on the very first-ever install (hadController is false),
  // since there's nothing stale to replace yet.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) location.reload();
  });
}

})();
</script>
